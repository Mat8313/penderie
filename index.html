function guessFromProbs(probs){
  const entries=Object.entries(CLOTHES).map(([i,v])=>({p:probs[i],type:v[0],style:v[1],season:v[2],label:v[3],kind:v[4]}));
  if(entries.reduce((a,e)=>a+e.p,0)<0.12) return null; // la photo ne ressemble à aucun vêtement connu du modèle
  const top=(list,f)=>{ const t={}; for(const e of list) t[e[f]]=(t[e[f]]||0)+e.p; return Object.entries(t).sort((x,y)=>y[1]-x[1])[0][0]; };
  const type=top(entries,"type");
  const same=entries.filter(e=>e.type===type); // style et saison : seulement parmi les classes du type retenu
  const best=same.reduce((x,y)=>y.p>x.p?y:x);
  return {type, style:top(same,"style"), season:top(same,"season"), label:best.label, kind:type==="accessoire"?best.kind:undefined, sub:type!=="accessoire"?best.kind:undefined};

async function recognize(canvas){
  const model = await loadModel();
  const probs = tf.tidy(()=>{
    const side=Math.min(canvas.width,canvas.height);
    const sq=document.createElement("canvas"); sq.width=sq.height=224;
    sq.getContext("2d").drawImage(canvas,(canvas.width-side)/2,(canvas.height-side)/2,side,side,0,0,224,224);
    const x=tf.browser.fromPixels(sq).toFloat().div(127.5).sub(1).expandDims(0);

async function processImage(file){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const max=900, r=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement("canvas"); cv.width=Math.round(img.width*r); cv.height=Math.round(img.height*r);
  const g=cv.getContext("2d"); g.drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(img.src);
  const wb=estimateWB(cv);
  const out=frameSubject(cv)||cv; // photo recadrée sur la pièce (ou intacte si la détection n'est pas sûre)

/* Bornes d'un masque à partir des sommes par colonne / ligne : on ignore un petit % de la masse de chaque côté,

function massBounds(arr, tot, cut){
  let a=0, acc=0; while(a<arr.length-1 && (acc+=arr[a])<tot*cut) a++;
  let b=arr.length-1; acc=0; while(b>a && (acc+=arr[b])<tot*cut) b--;
  return [a,b+1];

/* Recadrage d'une photo brute (sans détourage) :
   1. le fond est estimé sur la bordure de l'image (4 teintes max, k-means en Lab) ;
   2. un pixel est « pièce » s'il est loin de toutes ces teintes ;
   3. on prend la boîte qui contient la pièce, on la met au centre d'un carré complété avec la couleur du fond.
   Le carré évite que la vignette (carrée, object-fit:cover) coupe le haut d'un pantalon ou le bout d'une chaussure. */
function frameSubject(cv){
  const sb=subjectBox(cv); if(!sb) return null;
  const {x0,x1,y0,y1,w,h,r,cen}=sb, bW=x1-x0, bH=y1-y0;
  if(bW<w*.12||bH<h*.12) return null;                   // trop petit pour être la pièce
  if(bW*bH>w*h*.8 && Math.abs(bW/bH-1)<.25) return null; // déjà bien cadrée
  return squareCrop(cv,sb);

/* Boîte de la pièce (ou de la personne) sur la photo, en coordonnées réduites (r = échelle). */
function subjectBox(cv, cut=.015){
  const S=120, r=S/Math.max(cv.width,cv.height), w=Math.max(8,Math.round(cv.width*r)), h=Math.max(8,Math.round(cv.height*r));
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(cv,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data, lab=new Array(w*h);
  for(let i=0;i<w*h;i++) lab[i]=rgbToLab(d[i*4],d[i*4+1],d[i*4+2]);

  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(x<bw||y<bw||x>=w-bw||y>=h-bw) border.push(lab[y*w+x]);
  let cen=[0,1,2,3].map(k=>border[Math.floor((k+.5)*border.length/4)].slice());
  for(let it=0;it<6;it++){
    const acc=cen.map(()=>[0,0,0,0]);
    for(const p of border){ let bi=0,bd=1e9; cen.forEach((q,k)=>{ const dd=labDist(p,q,.5); if(dd<bd){bd=dd;bi=k;} }); const a=acc[bi]; a[0]+=p[0];a[1]+=p[1];a[2]+=p[2];a[3]++; }
    cen=cen.map((q,k)=>acc[k][3]?[acc[k][0]/acc[k][3],acc[k][1]/acc[k][3],acc[k][2]/acc[k][3]]:q);

function squareCrop(cv,{x0,x1,y0,y1,r,cen}){

/* ================= Recréer un look depuis une photo (Pinterest, Instagram, magazine…) =================
   1. on isole la personne avec l'outil de détourage (sinon on se contente de la bande centrale de l'image) ;
   2. on découpe la silhouette en zones selon ses proportions : haut, bas, chaussures ;
      dans la zone du haut, des bords d'une autre couleur que le centre = une veste ouverte par-dessus ;
   3. on ignore la peau (bras, cou, jambes) pour ne garder que la couleur des vêtements ;
   4. on cherche dans le dressing les pièces les plus proches de chaque couleur, puis on garde
      les combinaisons qui ressemblent le plus à la photo tout en restant harmonieuses. */

  // on retire la peau, sauf si presque tout ressemble à de la peau (vêtement beige, camel…)
  if(opaque-skin.length>opaque*.3){ for(const i of skin) d[i+3]=0; g.putImageData(im,0,0); }

function rgbFromLab([L,a,b]){
  const fy=(L+16)/116, fx=fy+a/500, fz=fy-b/200, f3=t=>t*t*t>0.008856?t*t*t:(t-16/116)/7.787;

  const lin=[3.2406*X-1.5372*Y-0.4986*Z, -0.9689*X+1.8758*Y+0.0415*Z, 0.0557*X-0.2040*Y+1.0570*Z];

/* Couleur dominante, version perceptuelle :
   1. on travaille dans l'espace Lab (distances proches de la perception humaine), pas en RGB ;
   2. on regroupe les pixels en 5 familles (k-means) au lieu de voter pixel par pixel ;
   3. on fusionne les familles de même teinte mais de luminosité différente (zones éclairées / plis à l'ombre) ;
   4. on compare la famille dominante à plusieurs nuances de référence par couleur, en pénalisant peu la luminosité
      (une ombre assombrit sans changer la couleur).
   Photo brute : centre de l'image. Photo détourée : tous les pixels opaques. */
const SHADES = {
  noir:["#141416","#232326","#2e2f33"], blanc:["#f6f6f3","#e9e9e4","#fbfaf5"], gris:["#8b8f96","#5c6066","#b9bdc3","#43464b"],
  beige:["#d8c6a5","#e3d5bb","#c4ae8a"], marine:["#1f2b47","#18213a","#2b3b5f","#232f4a"], denim:["#4b6a8f","#33496a","#7d97b6","#5a7aa0"],
  kaki:["#6c6c3e","#545a33","#8a8a5c","#5f6a45"], marron:["#6b4631","#4a2f22","#86593d","#3d2a20"], camel:["#b98a52","#c99c65","#a87843"],
  bordeaux:["#6e1f2d","#521823","#7d2a38"], rouge:["#c63a2f","#a8241c","#d9483a"], rose:["#e8a3b3","#f2c6d0","#d47a92","#f0b7a8"],
  orange:["#e07c2c","#ef9a4a","#c9651f"], jaune:["#e9c449","#f2dc86","#d4a82a"], vert:["#3e7d4f","#2a5a3a","#78a86a","#1f4a35"],
  bleu:["#3b7fd4","#6aa5e0","#2559a8","#9cc3ea"], violet:["#7b4fa1","#b79ad6","#5a3878"],
};
function hexToRgb(x){ return [1,3,5].map(k=>parseInt(x.slice(k,k+2),16)); }
function rgbToLab(r,g,b){
  const f=v=>{ v/=255; return v<=0.04045? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  const R=f(r),G=f(g),B=f(b);
  let X=(R*0.4124+G*0.3576+B*0.1805)/0.95047, Y=(R*0.2126+G*0.7152+B*0.0722), Z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const t=v=>v>0.008856? Math.cbrt(v) : 7.787*v+16/116;
  X=t(X); Y=t(Y); Z=t(Z);
  return [116*Y-16, 500*(X-Y), 200*(Y-Z)];
}
const PAL_LAB = Object.entries(SHADES).flatMap(([id,arr])=>arr.map(hx=>({id,lab:rgbToLab(...hexToRgb(hx))})));
function labDist(p,q,wL){ const dL=(p[0]-q[0])*wL, da=p[1]-q[1], db=p[2]-q[2]; return Math.sqrt(dL*dL+da*da+db*db); }
function nearestColors(lab){
  // la luminosité compte moins quand la pièce est colorée (ombres), davantage pour les neutres (noir/gris/blanc)
  const chroma=Math.hypot(lab[1],lab[2]), wL = chroma>18 ? 0.45 : 0.8;
  const best={};
  for(const p of PAL_LAB){ const d=labDist(lab,p.lab,wL); if(best[p.id]===undefined||d<best[p.id]) best[p.id]=d; }
  return Object.entries(best).sort((a,b)=>a[1]-b[1]);
}
/* Balance des blancs : si le fond de la photo brute est clair et neutre (drap, mur, sol clair),
   sa teinte révèle celle de la lumière (ampoule chaude, ombre bleutée). On corrige les canaux pour la neutraliser. */
function estimateWB(cv){
  const s=48, c=document.createElement("canvas"); c.width=c.height=s;
  const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(cv,0,0,s,s);
  const d=g.getImageData(0,0,s,s).data; let R=0,G=0,B=0,n=0;
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    if(x>4&&x<s-5&&y>4&&y<s-5) continue; // seulement la bordure
    const i=(y*s+x)*4; R+=d[i]; G+=d[i+1]; B+=d[i+2]; n++;
  }
  R/=n; G/=n; B/=n;
  const lab=rgbToLab(R,G,B);
  if(lab[0]<55 || Math.hypot(lab[1],lab[2])>22) return null; // fond foncé ou coloré : on ne peut rien en déduire
  const m=(R+G+B)/3, cl=v=>Math.max(0.82,Math.min(1.18,v));
  return [cl(m/R), cl(m/G), cl(m/B)];
}
function detectColor(cv, whole, wb){
  const s=64, c=document.createElement("canvas"); c.width=c.height=s;
  const w=cv.width, h=cv.height, cw=whole?w:w*.5, ch=whole?h:h*.5;
  const g=c.getContext("2d",{willReadFrequently:true}); g.imageSmoothingQuality="high";
  g.drawImage(cv,(w-cw)/2,(h-ch)/2,cw,ch,0,0,s,s);
  const d=g.getImageData(0,0,s,s).data;
  const px=[];
  const k0=wb||[1,1,1];
  for(let i=0;i<d.length;i+=4){ if(d[i+3]<160) continue; px.push(rgbToLab(Math.min(255,d[i]*k0[0]),Math.min(255,d[i+1]*k0[1]),Math.min(255,d[i+2]*k0[2]))); }
  if(px.length<20) return {id:"noir", alt:null, hex:null};
  // k-means, initialisation déterministe sur des quantiles de luminosité
  const k=Math.min(5,px.length);
  const sorted=[...px].sort((a,b)=>a[0]-b[0]);
  let cent=Array.from({length:k},(_,i)=>sorted[Math.floor((i+0.5)*sorted.length/k)].slice());
  const asg=new Int32Array(px.length);
  for(let it=0;it<12;it++){
    for(let i=0;i<px.length;i++){ let bi=0,bd=1e9; for(let j=0;j<k;j++){ const q=cent[j]; const dd=(px[i][0]-q[0])**2+(px[i][1]-q[1])**2+(px[i][2]-q[2])**2; if(dd<bd){bd=dd;bi=j;} } asg[i]=bi; }
    const sum=Array.from({length:k},()=>[0,0,0,0]);
    for(let i=0;i<px.length;i++){ const S=sum[asg[i]]; S[0]+=px[i][0]; S[1]+=px[i][1]; S[2]+=px[i][2]; S[3]++; }
    cent=sum.map((S,j)=>S[3]?[S[0]/S[3],S[1]/S[3],S[2]/S[3]]:cent[j]);
  }
  const cnt=new Array(k).fill(0); for(let i=0;i<px.length;i++) cnt[asg[i]]++;
  let groups=cent.map((c,j)=>({lab:c, w:cnt[j]})).filter(g=>g.w>0);
  // fusion des familles « même tissu, éclairage différent » : teinte proche, luminosité différente
  let merged=true;
  while(merged){
    merged=false;
    outer: for(let i=0;i<groups.length;i++) for(let j=i+1;j<groups.length;j++){
      const A=groups[i], B=groups[j];
      const ca=Math.hypot(A.lab[1],A.lab[2]), cb=Math.hypot(B.lab[1],B.lab[2]);
      const dab=Math.hypot(A.lab[1]-B.lab[1],A.lab[2]-B.lab[2]), dL=Math.abs(A.lab[0]-B.lab[0]);
      const bothNeutral = ca<10 && cb<10;
      if((!bothNeutral && dab<14 && dL<40) || (bothNeutral && dL<16)){
        const W=A.w+B.w;
        // on garde surtout la partie la mieux éclairée : c'est elle qui montre la vraie couleur
        const lit = A.lab[0]>B.lab[0]?A:B;
        const lab=[0,1,2].map(t=>(A.lab[t]*A.w+B.lab[t]*B.w)/W);
        lab[0]=lab[0]*0.6+lit.lab[0]*0.4;
        groups.splice(j,1); groups[i]={lab,w:W}; merged=true; break outer;
      }
    }
  }
  groups.sort((a,b)=>b.w-a.w);
  const total=groups.reduce((a,g)=>a+g.w,0);
  // motif : plusieurs familles bien colorées et bien différentes, chacune importante
  const strong=groups.filter(g=>g.w/total>0.18);
  if(strong.length>=3){
    let distinct=true;
    for(let i=0;i<strong.length;i++) for(let j=i+1;j<strong.length;j++) if(labDist(strong[i].lab,strong[j].lab,1)<28) distinct=false;
    if(distinct && strong.filter(g=>Math.hypot(g.lab[1],g.lab[2])>20).length>=2) return {id:"motif", alt:nearestColors(groups[0].lab)[0][0], hex:null};
  }
  const near=nearestColors(groups[0].lab);
  let second=null;
  if(whole){
    // une couleur franche (même en petite surface) parle plus qu'un neutre : la semelle blanche d'une basket
    // ou une doublure grise ne doivent pas masquer l'empiècement bleu
    const cands=groups.slice(1).filter(g=>g.w/total>=0.07).map(g=>({g,id:nearestColors(g.lab)[0][0],chroma:Math.hypot(g.lab[1],g.lab[2])}))
      .filter(x=>x.id!==near[0][0] && labDist(x.g.lab,groups[0].lab,1)>22);
    const colored=cands.find(x=>x.chroma>18 && C[x.id].fam!=="neutre");
    const neutral=cands.find(x=>x.g.w/total>=0.2);
    second=(colored||neutral)?.id||null;
  }
  const alt = near[1] && near[1][1] < near[0][1]*1.35 ? near[1][0] : null;
  return {id:near[0][0], alt, second, lab:groups[0].lab};
}

async function saveItem(){
  const s=sheetState; if(s.busy) return;
  const item={id:s.id,type:s.type,kind:s.type==="accessoire"?s.kind:undefined,sub:(s.sub&&SUB[s.type+":"+s.sub])?s.sub:undefined,color:s.color,color2:(s.color2&&s.color2!==s.color&&s.color!=="motif")?s.color2:null,style:s.style,season:s.season,name:(s.name||"").trim(),created:s.created,lastWorn:s.lastWorn||null,sample:s.isNew?false:!!s.sample,cut:!!s.cut};
  item.photo = s.newPhoto!==undefined ? s.newPhoto : (s.photo||null);
  item.orig = s.newPhoto!==undefined ? (s.newCut ? (s.newOrig||null) : null) : (s.orig||null); // photo avant détourage, pour pouvoir revenir en arrière
  if(s.newPhoto!==undefined) { dropURL(item.id); item.sample=false; item.cut=!!s.newCut; }
  item.brand=(s.brand||"").trim()||undefined;
  const pt = s.priceTxt!==undefined ? s.priceTxt : (s.price!=null?String(s.price):"");
  const pv = parseFloat(String(pt).replace(",",".").replace(/[^0-9.]/g,"")); item.price = pv>0 ? Math.round(pv*100)/100 : undefined;
  if(s.washEvery!==undefined) item.washEvery=Number(s.washEvery);
  item.since=s.since||0; item.dirty=!!s.dirty;
  try{ await put("items",item); }
  catch(err){ toast(err?.name==="QuotaExceededError" ? "Enregistrement impossible : le stockage du téléphone est plein."
                    : "Enregistrement impossible ("+(err?.name||"erreur")+"). Ferme l'app complètement et rouvre-la, tes pièces sont conservées."); return; }
  const idx=state.items.findIndex(i=>i.id===item.id);
  if(idx>=0) state.items[idx]=item; else state.items.push(item);
  if(s.batch){ state.current=null; render(); nextBatchItem(true); return; }
  const wasNew=s.isNew; closeSheet(); state.current=null; render();
  toast(wasNew?"Ajouté au dressing":"Modifications enregistrées");
}
async function deleteItem(id){
  await del("items",id); dropURL(id);
  state.items=state.items.filter(i=>i.id!==id);
  for(const f of state.outfits.filter(f=>f.ids.includes(id))){ await del("outfits",f.id); }
  state.outfits=state.outfits.filter(f=>!f.ids.includes(id));
  if(state.ctx.pin===id) state.ctx.pin=null;
  closeSheet(); state.current=null; render(); toast("Pièce supprimée");
}

// Conversion photo → texte pour la sauvegarde. Lecture via arrayBuffer (plus fiable que FileReader sur Safari),
// avec un délai maximum : une photo illisible ne doit jamais bloquer toute la sauvegarde.
async function blobToData(b){
  const read = (async()=>{
    const buf=new Uint8Array(await b.arrayBuffer()); let bin="";
    for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null, buf.subarray(i,i+0x8000));
    return `data:${b.type||"image/jpeg"};base64,${btoa(bin)}`;
  })();
  const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),15000));
  return Promise.race([read,timeout]);
}
async function importData(file){

      await put("items",{...i,photo}); dropURL(i.id);

    await load(); backupDone(); closeSheet(); state.current=null; render(); toast(`${data.items.length} pièces restaurées`);
  }catch(e){ toast("Ce fichier n'est pas une sauvegarde Penderie valide."); }
}

  for(let k=0;k<past.length;k++){ const ids=past[k].map(n=>pickN(n).id); const w={id:uid(),date:Date.now()-(k*2+1)*DAY,ids,sample:true}; await put("wears",w); state.wears.push(w); }
  state.wears.sort((a,b)=>b.date-a.date);
  closeSheet(); state.current=null; render(); toast("Exemples chargés. Remplace-les par tes vraies pièces.");
}
async function clearSamples(){
  const gone=new Set(state.items.filter(i=>i.sample).map(i=>i.id));
  for(const id of gone) await del("items",id);
  for(const f of state.outfits.filter(f=>f.ids.some(id=>gone.has(id)))) await del("outfits",f.id);
  for(const w of state.wears.filter(w=>w.sample||w.ids.some(id=>gone.has(id)))) await del("wears",w.id);
  state.outfits=state.outfits.filter(f=>!f.ids.some(id=>gone.has(id)));
  state.wears=state.wears.filter(w=>!(w.sample||w.ids.some(id=>gone.has(id))));
  if(gone.has(state.ctx.pin)) state.ctx.pin=null;
  state.items=state.items.filter(i=>!i.sample); closeSheet(); state.current=null; render(); toast("Exemples retirés");
}
function outfitAll(o){ return [...o.pieces, ...(o.acc||[]).map(a=>a.item)]; }

/* ================= Sauvegarde sans réglage =================
   Pas de compte ni de serveur : l'app prépare un fichier de sauvegarde et l'envoie dans la feuille de partage
   d'iOS (« Enregistrer dans Fichiers » → iCloud Drive). Un rappel discret apparaît seulement quand
   il y a des changements non sauvegardés. Le fichier garde toujours le même nom : iOS propose de remplacer l'ancien. */
const BK = {
  get(){ try{ return JSON.parse(localStorage.getItem("penderie.backup"))||{changes:0,last:0,snooze:0}; }catch(e){ return {changes:0,last:0,snooze:0}; } },
  set(v){ try{ localStorage.setItem("penderie.backup",JSON.stringify(v)); }catch(e){} },
  bump(){ const b=BK.get(); b.changes++; BK.set(b); backupFile=null; },
};
let backupFile=null, backupBusy=null, backupLost=0;
function needsBackup(){
  const b=BK.get(), real=state.items.filter(i=>!i.sample).length;
  // pas de rappel tant que le dressing est petit : on ne harcèle pas quelqu'un qui découvre l'app
  if(real<8 || b.changes===0 || Date.now()<b.snooze) return false;
  if(!b.last) return true;                       // jamais sauvegardé, et déjà 8 pièces
  return b.changes>=10 || Date.now()-b.last>7*DAY;
}
async function prepareBackup(){
  if(backupFile) return backupFile;
  if(backupBusy) return backupBusy;
  backupBusy=(async()=>{
    try{
      backupLost=0; const items=[];
      for(const i of state.items){ // une par une : moins de mémoire, et une photo illisible est simplement sautée
        let photo=null;
        if(i.photo){ try{ photo=await blobToData(i.photo); }catch(e){ backupLost++; } }
        items.push({...i, photo, orig:undefined});
      }
      const data = JSON.stringify({app:"penderie",version:3,exported:new Date().toISOString(),items,outfits:state.outfits,wears:state.wears,prefs});
      backupFile = new File([data],"Penderie-sauvegarde.json",{type:"application/json"});
      return backupFile;
    } finally { backupBusy=null; }
  })();
  return backupBusy;
}
function armBackupButton(label){
  // plusieurs boutons de sauvegarde peuvent être affichés en même temps (bandeau + réglages) : on les met tous à jour
  prepareBackup().then(()=>{
    document.querySelectorAll("[data-bk]").forEach(b=>{ b.disabled=false; b.dataset.act="backup"; if(/Préparation|Réessayer/.test(b.textContent)) b.textContent=b.closest(".bk")?"Sauvegarder":"Sauvegarder maintenant"; });
  }).catch(()=>{
    document.querySelectorAll("[data-bk]").forEach(b=>{ b.disabled=false; b.textContent="Réessayer"; b.dataset.act="backupretry"; });
    toast("La sauvegarde n'a pas pu être préparée. Réessaie.");
  });
}
function backupDone(){ BK.set({changes:0,last:Date.now(),snooze:0}); }
async function shareBackup(){
  // le fichier est préparé à l'avance : iOS exige que le partage parte directement du tap
  const f = backupFile || await prepareBackup();
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:"Sauvegarde Penderie"}); backupDone(); toast(backupLost?`Sauvegarde enregistrée (${backupLost} photo${backupLost>1?"s":""} illisible${backupLost>1?"s":""} non incluse${backupLost>1?"s":""})`:"Sauvegarde enregistrée"); render(); }
    catch(e){ if(e.name!=="AbortError") toast("Le partage a échoué. Réessaie."); }
  } else {
    const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); backupDone(); toast("Sauvegarde téléchargée"); render();
  }
}
function backupBanner(){
  if(!needsBackup()) return "";
  armBackupButton("Sauvegarder");
  const n=BK.get().changes;
  return `<div class="bk"><div><b>${n} changement${n>1?"s":""} pas encore sauvegardé${n>1?"s":""}</b><span class="sub">Un tap, puis « Enregistrer dans Fichiers » → iCloud Drive.</span></div>
    <div class="bk-a"><button class="btn primary sm" data-bk="1" data-act="backup" ${backupFile?"":"disabled"}>${backupFile?"Sauvegarder":"Préparation…"}</button><button class="link" data-act="snooze">Plus tard</button></div></div>`;
}

/* ================= Ajout en série =================
   Les photos sont analysées à la chaîne en arrière-plan. Dès que la première est prête, sa fiche s'affiche :
   tu corriges si besoin, « Enregistrer et suivante » passe à la pièce suivante (déjà analysée la plupart du temps). */
let batch=null;
async function startBatch(files){
  files=[...files].slice(0,40);
  if(!files.length) return;
  closeSheet();
  batch={files, ready:[], idx:0, saved:0, skipped:0, cancel:false, lock:null};
  try{ batch.lock=await navigator.wakeLock?.request("screen"); }catch(e){}
  showBatchItem();
  const me=batch;
  for(let i=0;i<files.length;i++){
    if(me.cancel) break;
    me.ready[i]=await analyzeFile(files[i]);
    if(me.cancel) break;
    if(batch===me && me.idx===i && !sheetState) showBatchItem(); // l'écran d'attente attendait celle-ci
    else if(batch===me && !sheetState) showBatchItem();         // met à jour la progression
  }
}
async function analyzeFile(f){
  try{
    const res=await processImage(f);
    const it={type:"haut", kind:"montre", color:res.color, colorAlt:res.colorAlt, color2:null, style:"casual", season:"toutes", photo:res.blob, orig:res.blob, cut:false, label:null};
    try{ const g=await recognize(res.canvas); if(g){ for(const k of ["type","style","season","kind","sub"]) if(g[k]) it[k]=g[k]; it.label=g.label; } }catch(e){}
    if(settings.cutout){ try{ const r=await cutout(res.blob,res.wb); it.photo=r.blob; it.cut=true; it.color=r.color; it.colorAlt=r.colorAlt; if(r.color2&&r.color2!==r.color) it.color2=r.color2; markSeen("cut"); }catch(e){} }
    return it;
  }catch(e){ return {error:true}; }
}
function showBatchItem(){
  if(!batch) return;
  const n=batch.files.length;
  if(batch.idx>=n) return finishBatch();
  const r=batch.ready[batch.idx];
  if(!r){
    sheetState=null;
    const doneN=batch.ready.filter(Boolean).length;
    openSheet(`<div class="grab"></div>
      <div class="sheet-h"><h2>Pièce ${batch.idx+1} sur ${n}</h2><button class="icon-btn" data-act="stopbatch" aria-label="Arrêter">${ICON.x}</button></div>
      <div class="scan">${ICON.bag}<span>Analyse de la photo ${batch.idx+1}…</span></div>
      <div class="score-row"><div style="flex:1"><div class="ctl-label" style="margin:0 0 5px">${doneN} sur ${n} analysée${doneN>1?"s":""}</div><div class="meter"><i style="width:${Math.round(100*doneN/n)}%"></i></div></div></div>
      <p class="sub" style="margin:0">Garde l'app ouverte. La fiche s'affiche dès que l'analyse est finie.</p>`);
    return;
  }
  if(r.error){ batch.skipped++; batch.idx++; toast(`Photo ${batch.idx} illisible, ignorée`); return showBatchItem(); }
  sheetState={id:uid(), type:r.type, kind:r.kind, sub:r.sub, color:r.color, colorAlt:r.colorAlt, color2:r.color2, style:r.style, season:r.season, name:"", photo:null,
    created:Date.now(), newPhoto:r.photo, newCut:r.cut, newOrig:r.orig, recoUnsure:!r.label, previewURL:URL.createObjectURL(r.photo), touched:new Set(), batch:true,
    hint: r.label ? `Reconnu : ${r.label}, couleur ${C[r.color].label.toLowerCase()}${r.color2?` et ${C[r.color2].label.toLowerCase()}`:""}. Corrige si besoin.` : `Type pas reconnu avec certitude, choisis-le. Couleur détectée : ${C[r.color].label.toLowerCase()}.`};
  renderEditor(true);
}
function nextBatchItem(saved){
  if(!batch) return;
  if(sheetState?.previewURL) URL.revokeObjectURL(sheetState.previewURL);
  batch.ready[batch.idx]=null; // libère la mémoire de la photo traitée
  if(saved) batch.saved++; else batch.skipped++;
  batch.idx++; sheetState=null;
  showBatchItem();
  const sh=document.querySelector(".sheet"); if(sh) sh.scrollTop=0;
}
function finishBatch(){
  if(!batch) return;
  const b=batch; b.cancel=true; batch=null;
  try{ b.lock?.release(); }catch(e){}
  closeSheet(); state.current=null; render();
  const left=b.files.length-b.saved-b.skipped;
  toast(`${b.saved} pièce${b.saved>1?"s":""} ajoutée${b.saved>1?"s":""}${b.skipped?` · ${b.skipped} ignorée${b.skipped>1?"s":""}`:""}${left>0?` · ${left} non traitée${left>1?"s":""}`:""}`);
}

/* ================= Pièces manquantes ================= */
const ARCHETYPES = [
  ["haut","blanc","casual","toutes","T-shirt blanc"],["haut","blanc","chic","toutes","Chemise blanche"],["haut","marine","casual","toutes","T-shirt marine"],
  ["haut","bleu","chic","toutes","Chemise bleu ciel"],["bas","denim","casual","toutes","Jean brut"],["bas","noir","chic","toutes","Pantalon noir"],
  ["bas","beige","poly","mi","Chino beige"],["bas","gris","sport","toutes","Jogging gris"],["chaussures","blanc","casual","toutes","Baskets blanches"],
  ["chaussures","marron","chic","toutes","Derbies marron"],["chaussures","noir","chic","toutes","Chaussures noires"],["chaussures","gris","sport","toutes","Baskets de sport"],
  ["pull","gris","poly","mi","Pull gris"],["pull","marine","poly","hiver","Pull marine"],["pull","beige","casual","mi","Sweat beige"],
  ["veste","marine","chic","mi","Veste marine"],["veste","noir","casual","hiver","Doudoune noire"],["veste","camel","chic","hiver","Manteau camel"],["veste","kaki","casual","mi","Surchemise kaki"],
];
const CONTEXTS = ["chaud","doux","froid"].flatMap(w=>["casual","chic","sport"].map(o=>({weather:w,occ:o})));
const CTX_LABEL = c=>`${{chaud:"Chaud",doux:"Doux",froid:"Froid"}[c.weather]} · ${{casual:"décontracté",chic:"habillé",sport:"sport"}[c.occ]}`;
function countGood(items, ctx, cap){
  const H=eligible(items,"haut",ctx), B=eligible(items,"bas",ctx), S=eligible(items,"chaussures",ctx);
  if(!H.length||!B.length||!S.length) return 0;
  const V = ctx.weather==="chaud" ? [] : eligible(items,"veste",ctx);
  const J = ctx.weather==="froid" && V.length ? V : [null,...V];
  const P = ctx.weather==="chaud" ? [null] : [null,...eligible(items,"pull",ctx)];
  const total=H.length*B.length*S.length*J.length*P.length;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const n=Math.min(total,cap); let good=0, tried=0;
  const test=(p)=>{ tried++; const o=scoreOutfit(p,{...ctx,pin:null}); if(o.colorScore>=7 && !o.warn.length) good++; };
  if(total<=cap){ for(const h of H)for(const b of B)for(const s of S)for(const v of J)for(const pu of P){ if(pu&&h.season==="hiver") continue; test([v,pu,h,b,s].filter(Boolean)); } }
  else for(let k=0;k<n;k++){ const h=pick(H), pu=pick(P); test([pick(J),pu&&h.season!=="hiver"?pu:null,h,pick(B),pick(S)].filter(Boolean)); }
  return tried? Math.round(good/tried*total) : 0;
}
async function analyzeGaps(){
  const items=state.items.filter(i=>i.type!=="accessoire");
  state.gaps={busy:true, progress:0}; render();
  const base=CONTEXTS.map(c=>countGood(items,c,1500));
  const holes=CONTEXTS.map((c,i)=>({c,n:base[i],miss:generate(items,{...c,pin:null},new Set()).missing})).filter(x=>x.miss||x.n===0);
  const owned=a=>items.some(i=>i.type===a[0] && i.color===a[1] && (i.style===a[2]||i.style==="poly"||a[2]==="poly"));
  const sug=[];
  const arch=ARCHETYPES.filter(a=>!owned(a));
  for(let k=0;k<arch.length;k++){
    const a=arch[k], fake={id:"_x"+k,type:a[0],color:a[1],style:a[2],season:a[3],name:a[4]};
    let gain=0, fixes=0;
    for(let i=0;i<CONTEXTS.length;i++){ const n=countGood([...items,fake],CONTEXTS[i],1500); gain+=Math.max(0,n-base[i]); if(base[i]===0&&n>0) fixes++; }
    if(gain>0) sug.push({a,gain,fixes});
    state.gaps.progress=Math.round(100*(k+1)/arch.length);
    if(k%2===1){ render(); await new Promise(r=>setTimeout(r,0)); }
  }
  sug.sort((x,y)=>(y.fixes*1000+y.gain)-(x.fixes*1000+x.gain));
  // ceinture : utile seulement s'il n'y en a aucune du même cuir que tes chaussures habillées les plus courantes
  const belts=state.items.filter(i=>i.type==="accessoire"&&i.kind==="ceinture").map(i=>LEATHER(i.color));
  const leatherShoes=items.filter(i=>i.type==="chaussures"&&["brun","noir"].includes(LEATHER(i.color)));
  const beltTips=[...new Set(leatherShoes.map(s=>LEATHER(s.color)))].filter(l=>!belts.includes(l)).map(l=>l==="brun"?"Une ceinture marron, pour aller avec tes chaussures marron":"Une ceinture noire, pour aller avec tes chaussures noires");
  state.gaps={busy:false, holes, sug:sug.slice(0,4), beltTips, sig:state.items.length+":"+state.items.map(i=>i.id+i.color+i.type+i.style+i.season).join("").length, base:base.reduce((a,b)=>a+b,0)};
  render();
}
function gapsHtml(){
  const g=state.gaps;
  const sig=state.items.length+":"+state.items.map(i=>i.id+i.color+i.type+i.style+i.season).join("").length;
  if(!g || (!g.busy && g.sig!==sig)) return `<p class="sub" style="margin:0 0 10px">L'app teste toutes les combinaisons de ton dressing pour trouver les trous et les pièces qui débloqueraient le plus de tenues.</p><button class="btn primary" data-act="gaps" style="width:100%">Analyser mon dressing</button>`;
  if(g.busy) return `<div class="score-row"><div style="flex:1"><div class="ctl-label" style="margin:0 0 5px">Analyse des combinaisons… ${g.progress}%</div><div class="meter"><i style="width:${g.progress}%"></i></div></div></div>`;
  const holes = g.holes.length ? `<div class="gap-list">${g.holes.map(h=>`<div class="gap"><b>${CTX_LABEL(h.c)}</b><span>${h.miss?`il manque ${h.miss.join(", ")}`:"aucune tenue vraiment réussie"}</span></div>`).join("")}</div>` : `<p class="sub" style="margin:0">Tu as au moins une bonne tenue pour chaque météo et chaque occasion.</p>`;
  const sug = g.sug.length||g.beltTips.length ? `<div class="rank">${g.sug.map(s=>{ const f={type:s.a[0],color:s.a[1],kind:null}; return `<div class="rk"><div class="ph">${silhouette(f)}</div><div class="rk-b"><div class="rk-n"><span>${esc(s.a[4])}</span><b>+${s.gain}</b></div><span class="sub">${s.fixes?`comble ${s.fixes} trou${s.fixes>1?"s":""} · `:""}+${s.gain} tenue${s.gain>1?"s":""} réussie${s.gain>1?"s":""}</span></div></div>`; }).join("")}${g.beltTips.map(t=>`<div class="rk"><div class="ph">${silhouette({type:"accessoire",kind:"ceinture",color:t.includes("marron")?"marron":"noir"})}</div><div class="rk-b"><span>${t}</span></div></div>`).join("")}</div>`
    : `<p class="sub" style="margin:0">Rien d'évident à ajouter : ton dressing est bien équilibré.</p>`;
  return `<div class="ctl-label">Les trous</div>${holes}<div class="ctl-label" style="margin-top:14px">Ce qui ferait le plus de différence</div>${sug}
    <p class="sub" style="margin:10px 0 0">Aujourd'hui : environ ${g.base} combinaisons réussies, toutes météos et occasions confondues. <button class="link" data-act="gaps">Relancer</button></p>`;
}

const loadValise=()=>{ try{ return JSON.parse(localStorage.getItem(VAL_KEY)); }catch(e){ return null; } };
const saveValise=v=>{ try{ v?localStorage.setItem(VAL_KEY,JSON.stringify(v)):localStorage.removeItem(VAL_KEY); }catch(e){} };
let valForm={dest:"",days:5,chic:1,sport:0,weather:"auto"};
function openValiseForm(){

async function forecastFor(dest, n){
  const g=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(dest)}&count=1&language=fr&format=json`)).json();
  const r=g.results?.[0]; if(!r) throw new Error("ville");
  const d=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${r.latitude}&longitude=${r.longitude}&daily=apparent_temperature_max,apparent_temperature_min,precipitation_probability_max&timezone=auto&forecast_days=${Math.min(16,n)}`)).json();
  const days=d.daily.apparent_temperature_max.map((mx,i)=>{ const mn=d.daily.apparent_temperature_min[i]; return {weather:feelToWeather((2*mx+mn)/3), rain:(d.daily.precipitation_probability_max?.[i]??0)>=50, min:mn, max:mx}; });
  while(days.length<n) days.push({...days[days.length-1]}); // au-delà de 16 jours : on prolonge la dernière prévision
  return {place:r.name+(r.country?`, ${r.country}`:""), days};
}
async function buildValise(){
  const n=valForm.days;
  let place=valForm.dest.trim()||null, wdays;
  if(valForm.weather==="auto"){
    if(!place){ toast("Indique une destination, ou choisis la météo à la main."); return; }
    openSheet(`<div class="grab"></div><div class="sheet-h"><h2>Mode valise</h2></div><p class="sub">Récupération de la météo à ${esc(place)}…</p>`);
    try{ const f=await forecastFor(place,n); place=f.place; wdays=f.days; }
    catch(e){ toast(e.message==="ville"?"Destination introuvable. Vérifie l'orthographe.":"Météo indisponible. Choisis-la à la main."); openValiseForm(); return; }
  } else wdays=Array.from({length:n},()=>({weather:valForm.weather, rain:false}));
  // occasions : sport en début de séjour, soirées habillées en fin, le reste décontracté
  const occ=Array.from({length:n},()=>"casual");
  for(let i=0;i<Math.min(valForm.sport,n);i++) occ[i]="sport";
  for(let i=0;i<Math.min(valForm.chic,n);i++) if(occ[n-1-i]==="casual") occ[n-1-i]="chic";
  const items=state.items.filter(i=>i.type!=="accessoire");
  const chosen=new Set(), useCount={}, seen=new Set(), plan=[];
  for(let d=0; d<n; d++){
    const ctx={weather:wdays[d].weather, occ:occ[d], rain:wdays[d].rain, pin:null};
    const H=eligible(items,"haut",ctx), B=eligible(items,"bas",ctx), S=eligible(items,"chaussures",ctx);
    if(!H.length||!B.length||!S.length){ plan.push({...wdays[d],occ:occ[d],ids:[],acc:[],missing:true}); continue; }
    const V=ctx.weather==="chaud"?[]:eligible(items,"veste",ctx);
    const J=(ctx.weather==="froid"||ctx.rain)&&V.length?V:[null,...V];
    const P=ctx.weather==="chaud"?[null]:[null,...eligible(items,"pull",ctx)];
    let best=null, bs=-1e9;
    const consider=p=>{
      const k=p.map(x=>x.id).sort().join(","); if(seen.has(k)) return;
      const o=scoreOutfit(p,ctx); let s=o.s;
      for(const x of p){
        if(chosen.has(x.id)) s+=3; else s-=2.5;                       // réutiliser ce qui est déjà dans la valise
        const u=useCount[x.id]||0;
        if((x.type==="haut")&&u>=1) s-=4*u;                          // un haut ne se porte pas tous les jours
        if(x.type==="pull"&&u>=2) s-=3*u;
        if(x.type==="chaussures"&&!chosen.has(x.id)&&[...chosen].filter(id=>items.find(i=>i.id===id)?.type==="chaussures").length>=2) s-=5; // 3 paires max
      }
      if(s>bs){ bs=s; best={p,o,k}; }
    };
    const total=H.length*B.length*S.length*J.length*P.length, pick=a=>a[Math.floor(Math.random()*a.length)];
    if(total<=15000){ for(const h of H)for(const b of B)for(const s of S)for(const v of J)for(const pu of P){ if(pu&&h.season==="hiver") continue; consider([v,pu,h,b,s].filter(Boolean)); } }
    else for(let k=0;k<15000;k++){ const h=pick(H), pu=pick(P); consider([pick(J),pu&&h.season!=="hiver"?pu:null,h,pick(B),pick(S)].filter(Boolean)); }
    if(!best){ plan.push({...wdays[d],occ:occ[d],ids:[],acc:[],missing:true}); continue; }
    seen.add(best.k);
    for(const x of best.p){ chosen.add(x.id); useCount[x.id]=(useCount[x.id]||0)+1; }
    const acc=pickAccessories(state.items,best.p,ctx,null).map(a=>a.item.id);
    for(const id of acc) chosen.add(id);
    plan.push({...wdays[d],occ:occ[d],ids:best.p.map(x=>x.id),acc});
  }
  const v={created:Date.now(), place, nights:n, plan, packed:{}};
  saveValise(v); openValise(v);
}

   Sur iPhone, l'app de l'écran d'accueil a son propre stockage, séparé de Safari : les réglages choisis ici
   sont donc aussi glissés dans l'adresse (#cfg=…), que l'icône reprend à la première ouverture. */

const isStandalone=()=> navigator.standalone===true || matchMedia("(display-mode: standalone)").matches;
function platform(){
  const ua=navigator.userAgent;
  const ios=/iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  if(ios) return /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua) ? "ios-other" : "ios";
  if(/Android/.test(ua)) return "android";
  return "desktop";
}
function cfgString(){ return btoa(unescape(encodeURIComponent(JSON.stringify({k:currentSkin(),o:state.ctx.occ,s:settings})))); }
function applyCfgFromHash(){
  const m=location.hash.match(/^#cfg=([A-Za-z0-9+/=]+)/); if(!m) return false;
  try{
    const c=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    let done=false; try{ done=localStorage.getItem("penderie.onboarded")==="1"; }catch(e){}
    if(!done){
      if(c.k) applySkin(c.k);
      if(c.o && OCC[c.o]){ state.ctx.occ=c.o; saveCtx(); }
      if(c.s) { Object.assign(settings,c.s); saveSettings(); }
      try{ localStorage.setItem("penderie.onboarded","1"); }catch(e){}
      return true;
    }
  }catch(e){}
  return false;
}

function finishOnboarding(){
  try{ localStorage.setItem("penderie.onboarded","1"); }catch(e){}
  ob=null; closeSheet(); state.current=null; render();
}
async function onboardingAction(act,b){
  if(!ob) return;
  const last = isStandalone()?3:4;
  if(act==="obnext"){
    if(ob.step===last-1 && !isStandalone()) history.replaceState(null,"",location.pathname+location.search+"#cfg="+cfgString()); // l'icône reprendra ces réglages
    if(ob.step>=last){ finishOnboarding(); return; }
    if(ob.step===3 && isStandalone()){ finishOnboarding(); return; }
    ob.step++; renderOnboarding(); document.querySelector(".sheet").scrollTop=0;
  }
  else if(act==="obprev"){ ob.step=Math.max(0,ob.step-1); renderOnboarding(); }
  else if(act==="obskip"||act==="obdone"){ if(!isStandalone()) history.replaceState(null,"",location.pathname+location.search+"#cfg="+cfgString()); finishOnboarding(); }
  else if(act==="obwx"){ state.ctx.wmode="auto"; saveCtx(); b.textContent="Recherche de ta position…"; await refreshWeather(true); if(ob) renderOnboarding(); }
  else if(act==="obinstall"){ try{ installEvt.prompt(); const r=await installEvt.userChoice; installEvt=null; if(r.outcome==="accepted") finishOnboarding(); else renderOnboarding(); }catch(e){} }
}

/* ================= Changer une seule pièce ================= */
function swapCandidates(type){
  const o=state.current.outfit, ctx=state.ctx, cur=o.pieces.find(p=>p.type===type);
  const base=o.pieces.filter(p=>p.type!==type);
  const order=p=>MAIN_ORDER.indexOf(p.type);
  const opts=state.items.filter(i=>i.type===type && i.id!==cur?.id && !isDirty(i) && OCC[ctx.occ][i.style]!==null && SEA[ctx.weather][i.season]!==null)
    .map(i=>{ const pieces=[...base,i].sort((a,b)=>order(a)-order(b)); return {item:i, pieces, sc:scoreOutfit(pieces,ctx)}; });
  if(cur && (type==="veste"||type==="pull")) opts.push({item:null, pieces:base, sc:scoreOutfit(base,ctx)});
  return {cur, opts:opts.sort((a,b)=>b.sc.s-a.sc.s)};
}
function addLayerLinks(o){
  if(state.ctx.weather==="chaud") return "";
  const links=[];
  for(const [t,l] of [["veste","une veste"],["pull","un pull"]]){
    if(o.pieces.some(p=>p.type===t)) continue;
    if(t==="pull" && !settings.layering) continue;
    if(state.items.some(i=>i.type===t && !isDirty(i))) links.push(`<button class="link" data-act="swap" data-type="${t}">+ Ajouter ${l}</button>`);
  }
  return links.length?`<div class="mini-links">${links.join("")}</div>`:"";
}
function openSwap(type){
  if(!state.current?.outfit) return;
  const {cur,opts}=swapCandidates(type);
  const L={haut:"le haut",bas:"le bas",robe:"la robe",chaussures:"les chaussures",veste:"la veste",pull:"le pull"};
  openSheet(`<div class="grab"></div>
    <div class="sheet-h"><h2>${cur?`Changer ${L[type]}`:`Ajouter ${type==="veste"?"une veste":"un pull"}`}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">${ICON.x}</button></div>
    ${opts.length?`<p class="sub" style="margin:0">Classés du plus au moins assorti avec le reste de la tenue.</p>
    <div class="rank">${opts.map(x=>`<button class="rk pick" data-act="swapto" data-type="${type}" data-id="${x.item?x.item.id:"none"}">${x.item?ph(x.item):`<div class="ph">${ICON.x}</div>`}<div class="rk-b"><div class="rk-n"><span>${x.item?esc(itemName(x.item)):`Sans ${type==="veste"?"veste":"pull"}`}</span><b>${x.sc.colorScore}/10</b></div><span class="sub">${esc(x.sc.warn[0]||x.sc.ok[0]||"")}</span></div></button>`).join("")}</div>`
    :`<p class="sub">Aucune autre pièce de ce type ne convient à cette météo et cette occasion${state.items.some(i=>i.type===type&&isDirty(i))?" (certaines sont au lavage)":""}.</p>`}`);
}
function applySwap(type,id){
  const o=state.current.outfit, x=swapCandidates(type).opts.find(z=>(z.item?z.item.id:"none")===id);
  if(!x) return;
  state.current={...state.current, outfit:{...x.sc, pieces:x.pieces, acc:o.acc, k:x.pieces.map(p=>p.id).sort().join(",")}};
  closeSheet(); render();
}

/* ================= Glisser la tenue ================= */
const swipeHintSeen=()=>{ try{ return localStorage.getItem("penderie.swipe")==="1"; }catch(e){ return false; } };
let swiped=false;
function bindSwipe(){
  const card=document.querySelector(".outfit"); if(!card) return;
  let x0=null,y0=0,dx=0,drag=false;
  card.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; drag=false; card.style.transition="none"; },{passive:true});
  card.addEventListener("touchmove",e=>{
    if(x0==null) return; dx=e.touches[0].clientX-x0; const dy=e.touches[0].clientY-y0;
    if(!drag && Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.4) drag=true;
    if(drag){ e.preventDefault(); card.style.transform=`translateX(${dx}px) rotate(${dx/28}deg)`; card.dataset.dir = dx>40?"like":dx<-40?"next":""; }
  },{passive:false});
  card.addEventListener("touchend",async()=>{
    if(x0==null) return; x0=null;
    if(!drag) return;
    swiped=true; setTimeout(()=>swiped=false,80);
    try{ localStorage.setItem("penderie.swipe","1"); }catch(e){}
    card.style.transition="transform .25s ease, opacity .25s";
    if(dx<-90){ card.style.transform="translateX(-120%) rotate(-12deg)"; card.style.opacity="0"; setTimeout(()=>document.querySelector('[data-act="next"]')?.click(),180); }
    else if(dx>90){
      card.style.transform="translateX(0)"; card.dataset.dir="";
      const fav=document.querySelector('[data-act="fav"]'); if(fav && fav.getAttribute("aria-pressed")!=="true") fav.click(); else toast("Déjà dans tes favoris ♥");
    }
    else { card.style.transform=""; card.dataset.dir=""; }
  });
}

/* ================= Événements ================= */
document.addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(swiped && b.closest(".outfit")) return; // un glissement n'est pas un tap
  if(b.dataset.tab){ state.tab=b.dataset.tab; render(); scrollTo(0,0); return; }
  if(b.dataset.seg==="setjacket"){ settings.jacket=b.dataset.v; saveSettings(); state.current=null; b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); return; }
  if(b.dataset.seg==="obocc"){ state.ctx.occ=b.dataset.v; saveCtx(); state.current=null; b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); return; }
  if(b.dataset.seg==="vweather"){ valForm.weather=b.dataset.v; b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); return; }
  if(b.dataset.seg){
    if(b.dataset.seg==="weather"){
      if(b.dataset.v==="auto"){ state.ctx.wmode="auto"; saveCtx(); refreshWeather(); }
      else { state.ctx.wmode="manual"; state.ctx.weather=b.dataset.v; state.ctx.rain=false; }
    } else state.ctx[b.dataset.seg]=b.dataset.v;
    state.current=null; state.avoid.clear(); saveCtx(); render(); return;
  }
  if(b.dataset.skin){ applySkin(b.dataset.skin); b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); return; }
  if(b.dataset.filter){ state.filter=b.dataset.filter; state.sub=null; render(); return; }
  if(b.dataset.subf!==undefined){ state.sub=b.dataset.subf||null; render(); return; }
  if(b.dataset.f && sheetState){
    const s=sheetState, f=b.dataset.f, v=b.dataset.v;
    if(f==="sub"){
      s.sub = s.sub===v ? null : v; // re-toucher la catégorie choisie la retire
      const d=SUB[s.type+":"+s.sub];
      if(d && s.isNew){ if(d.style&&!s.touched?.has("style")) s.style=d.style; if(d.season&&!s.touched?.has("season")) s.season=d.season; }
    } else s[f]=v;
    s.touched?.add(f);
    if(f==="type" && s.sub && !SUB[v+":"+s.sub]) s.sub=null;
    if(f==="color2"){ s.color2=v||null; }
    if(f==="color" && s.color2===v) s.color2=null;
    if(s.editRow && !s.expanded){ if(f!=="type") s.editRow=null; renderEditor(s.isNew); return; } // résumé : la ligne se referme dès qu'on a choisi
    if(["type","kind","color","sub"].includes(f)){ const sc=document.querySelector(".sheet")?.scrollTop||0; renderEditor(sheetState.isNew); const sh=document.querySelector(".sheet"); if(sh) sh.scrollTop=sc; return; }
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    if(b.dataset.f==="color"){ const p=document.querySelector(".photo-pick .ph"); if(p&&!sheetState.previewURL&&!sheetState.photo) p.outerHTML=ph(sheetState); }
    return;
  }
  const act=b.dataset.act; if(!act) return;
  const cur=state.current?.outfit;
  if(act==="add") openEditor(null);
  else if(act==="close") closeSheet();
  else if(act==="edit") openEditor(state.items.find(i=>i.id===b.dataset.id));
  else if(act==="save") saveItem();
  else if(act==="askdel") document.getElementById("delZone").innerHTML=`<div class="confirm"><span>Supprimer définitivement ?</span><button class="btn danger" data-act="del">Oui, supprimer</button><button class="btn ghost" data-act="nodel">Annuler</button></div>`;
  else if(act==="nodel") document.getElementById("delZone").innerHTML=`<button class="btn danger" data-act="askdel" style="width:100%">Supprimer cette pièce</button>`;
  else if(act==="del") deleteItem(sheetState.id);
  else if(act==="cutnow"){
    const s=sheetState; s.newOrig = s.newPhoto!==undefined ? (s.newOrig||s.newPhoto) : (s.orig||s.photo); s.busy=true; s.hint=seen("cut")?"On retire le fond…":"On retire le fond… Première fois : téléchargement de l'outil (~40 Mo, une seule fois)."; s.busyMsg=s.hint; renderEditor(s.isNew);
    await doCutout(s, s.newPhoto!==undefined ? s.newPhoto : s.photo);
    if(sheetState!==s) return;
    s.busy=false; s.hint = s.cutFailed ? "Le fond n'a pas pu être retiré. Vérifie ta connexion et réessaie." : "Fond retiré. Enregistre pour garder cette version.";
    renderEditor(s.isNew);
  }
  else if(act==="pin"){ closeSheet(); state.ctx.pin=b.dataset.id; state.tab="tenue"; state.current=null; state.avoid.clear(); render(); scrollTo(0,0); }
  else if(act==="unpin"){ state.ctx.pin=null; state.current=null; render(); }
  else if(act==="next" && state.current?.insp){ const g=state.current, ins=g.insp;
    if(ins.list.length<2){ closeLook(); render(); return; }
    ins.idx=(ins.idx+1)%ins.list.length; const x=ins.list[ins.idx];
    state.current={...g, outfit:{pieces:x.pieces, acc:[], k:x.k, ...x.sc}}; render(); }
  else if(act==="closeinsp"){ closeLook(); render(); }
  else if(act==="next"){ if(cur) state.avoid.add(cur.k); state.current=generate(state.items,state.ctx,state.avoid); render(); }
  else if(act==="dislike"){ if(!cur) return; await learn(cur.pieces,-1); state.avoid.add(cur.k); state.current=generate(state.items,state.ctx,state.avoid); render(); toast("Noté, l'app évitera ce genre de tenue."); }
  else if(act==="fav"){
    const ex=state.outfits.find(f=>f.k===cur.k);
    if(ex){ await del("outfits",ex.id); state.outfits=state.outfits.filter(f=>f!==ex); await learn(cur.pieces,-1); toast("Retirée des favoris"); }
    else { const f={id:uid(),k:cur.k,ids:outfitAll(cur).map(p=>p.id),created:Date.now()}; await put("outfits",f); state.outfits.unshift(f); await learn(cur.pieces,1); toast("Tenue gardée en favori. L'app s'en souviendra."); }
    render();
  }
  else if(act==="wear"){
    const now=Date.now(), all=outfitAll(cur);
    const toWash=[];
    for(const p of all){
      const it=state.items.find(i=>i.id===p.id); it.lastWorn=now; p.lastWorn=now;
      it.since=(it.since||0)+1;
      if(settings.laundry && washEvery(it)>0 && it.since>=washEvery(it)){ it.dirty=true; toWash.push(it); }
      await put("items",it);
    }
    const w={id:uid(),date:now,ids:all.map(p=>p.id)}; await put("wears",w); state.wears.unshift(w);
    await learn(cur.pieces,0.5);
    toast(`C'est noté pour aujourd'hui !${toWash.length?` ${toWash.length===1?itemName(toWash[0])+" passe":toWash.length+" pièces passent"} au lavage.`:""}`);
    state.current=null; render();
  }
  else if(act==="delwear"){ await del("wears",b.dataset.id); state.wears=state.wears.filter(w=>w.id!==b.dataset.id); render(); }
  else if(act==="showfav"){
    const f=state.outfits.find(x=>x.id===b.dataset.id); const all=f.ids.map(id=>state.items.find(i=>i.id===id));
    const pieces=all.filter(p=>p.type!=="accessoire"), acc=all.filter(p=>p.type==="accessoire").map(item=>({item}));
    state.current={outfit:{pieces,acc,k:f.k,...scoreOutfit(pieces,state.ctx)}}; render(); scrollTo({top:0,behavior:"smooth"});
  }
  else if(act==="unfav"){ await del("outfits",b.dataset.id); state.outfits=state.outfits.filter(f=>f.id!==b.dataset.id); render(); }
  else if(act==="wxauto"){ state.ctx.wmode="auto"; saveCtx(); refreshWeather(); }
  else if(act==="wxretry") refreshWeather(true);
  else if(act==="menu") openMenu();
  else if(act==="togglecut"){ settings.cutout=!settings.cutout; saveSettings(); b.setAttribute("aria-pressed",settings.cutout); }
  else if(act==="askreset") document.getElementById("prefZone").innerHTML=`<div class="confirm"><span>Oublier tous les goûts appris ?</span><button class="btn danger" data-act="resetprefs">Oui, réinitialiser</button></div>`;
  else if(act==="resetprefs"){ prefs={pairs:{},colors:{}}; await put("meta",{key:"prefs",...prefs}); state.current=null; closeSheet(); render(); toast("Goûts appris réinitialisés"); }
  else if(act==="backup") shareBackup();
  else if(act==="washall"){ for(const it of state.items.filter(i=>i.dirty||i.since)){ it.dirty=false; it.since=0; await put("items",it); } state.current=null; state.filter="tout"; render(); toast("Tout est propre, les pièces reviennent dans les tenues."); }
  else if(act==="toggledirty"){ sheetState.dirty=!sheetState.dirty; if(!sheetState.dirty) sheetState.since=0; renderEditor(sheetState.isNew); }
  else if(act==="toggleset"){ const k=b.dataset.k; settings[k]=!settings[k]; saveSettings(); b.setAttribute("aria-pressed",settings[k]); state.current=null; }
  else if(act==="swap") openSwap(b.dataset.type);
  else if(act==="swapto") applySwap(b.dataset.type,b.dataset.id);
  else if(act==="help") openHelp();
  else if(act==="reframe"){
    const s=sheetState, src=s.newPhoto!==undefined?s.newPhoto:s.photo, isCut=s.newPhoto!==undefined?!!s.newCut:!!s.cut;
    let out=null; try{ out=await reframeBlob(src,isCut); }catch(e){}
    if(sheetState!==s) return;
    s.reframed=true;
    if(!out){ s.hint="La pièce est déjà bien cadrée (ou le fond est trop chargé pour la repérer)."; renderEditor(s.isNew); return; }
    if(s.previewURL) URL.revokeObjectURL(s.previewURL);
    if(s.newPhoto===undefined){ s.newCut=isCut; s.newOrig=isCut?(s.orig||null):out; }
    else if(!isCut) s.newOrig=out;
    s.newPhoto=out; s.previewURL=URL.createObjectURL(out);
    s.hint="Photo recadrée. Enregistre pour garder cette version."; renderEditor(s.isNew);
  }
  else if(act==="editrow"){ const s=sheetState; s.editRow = s.editRow===b.dataset.k ? null : b.dataset.k; const sc=document.querySelector(".sheet")?.scrollTop||0; renderEditor(s.isNew); const sh=document.querySelector(".sheet"); if(sh) sh.scrollTop=sc; }
  else if(act==="expand"){ sheetState.expanded=true; sheetState.editRow=null; renderEditor(sheetState.isNew); const sh=document.querySelector(".sheet"); if(sh) sh.scrollTop=0; }
  else if(act==="addtype"){ openEditor(null,{type:b.dataset.type, presetLabel:b.dataset.label}); }
  else if(act==="uncut"){ const s=sheetState; const o=s.newOrig||s.orig; if(s.previewURL) URL.revokeObjectURL(s.previewURL); s.newPhoto=o; s.newOrig=o; s.newCut=false; s.previewURL=URL.createObjectURL(o); s.hint="Photo d'origine restaurée. Enregistre pour garder cette version."; renderEditor(s.isNew); }
  else if(act==="esshide"){ try{ localStorage.setItem("penderie.essHidden","1"); }catch(e){} render(); }
  else if(act==="ess"){ const e=ESSENTIALS[Number(b.dataset.k)]; openEditor(null, {...e.preset, presetLabel:e.label}); }
  else if(act==="onboarding"){ closeSheet(); startOnboarding(true); }
  else if(act?.startsWith("ob")) onboardingAction(act,b);
  else if(act==="backupretry"){ backupFile=null; b.disabled=true; b.textContent="Préparation…"; armBackupButton(b.closest(".bk")?"Sauvegarder":"Sauvegarder maintenant"); }
  else if(act==="snooze"){ const k=BK.get(); k.snooze=Date.now()+3*DAY; BK.set(k); render(); }
  else if(act==="stopbatch") finishBatch();
  else if(act==="skipbatch") nextBatchItem(false);
  else if(act==="gaps") analyzeGaps();
  else if(act==="valise") openValise();
  else if(act==="valnew") openValiseForm();
  else if(act==="valdel"){ saveValise(null); closeSheet(); render(); }
  else if(act==="valgo") buildValise();
  else if(act==="vstep"){ const k=b.dataset.k, lim={days:[1,21],chic:[0,10],sport:[0,10]}[k]; valForm[k]=Math.max(lim[0],Math.min(lim[1],valForm[k]+Number(b.dataset.d))); document.getElementById("v_"+k).textContent=valForm[k]; }
  else if(act==="pack"){ const v=loadValise(); v.packed[b.dataset.id]=!v.packed[b.dataset.id]; saveValise(v); const sc=document.querySelector(".sheet").scrollTop; openValise(v); document.querySelector(".sheet").scrollTop=sc; }
  else if(act==="samples") loadSamples();
  else if(act==="clearsamples") clearSamples();
  else if(act==="import") document.getElementById("importFile").click();
});
document.getElementById("addBtn").addEventListener("click",()=>openEditor(null));
function closeLook(){ const i=state.current?.insp; if(i) URL.revokeObjectURL(i.url); state.current=null; }
document.addEventListener("change",async e=>{
  if(e.target.id!=="lookIn") return;
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  openSheet(`<div class="sheet-h"><h2>Recréer un look</h2></div><div class="photo-big"><div class="ph"><img src="${URL.createObjectURL(f)}" alt=""></div><div class="busy"><span class="spin"></span>${seen("cut")?"On analyse la tenue…":"On analyse la tenue… Première fois : téléchargement de l'outil (~40 Mo, une seule fois)."}</div></div>`);
  let a=null; try{ a=await analyzeLook(f); markSeen("cut"); }catch(err){}
  closeSheet();
  if(!a||!a.t.haut&&!a.t.bas){ toast("Impossible de repérer la tenue sur cette photo. Essaie une photo où la personne est bien visible."); return; }
  const m=lookMatch(a.t, state.items, state.ctx);
  if(!m||!m.list.length){ toast("Ajoute au moins un haut, un bas et des chaussures pour recréer un look."); return; }
  closeLook();
  const x=m.list[0];
  state.current={outfit:{pieces:x.pieces, acc:[], k:x.k, ...x.sc}, insp:{url:URL.createObjectURL(a.blob), t:a.t, list:m.list, idx:0, notes:m.notes}};
  state.tab="tenue"; render(); scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("importFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) importData(f); e.target.value=""; });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(batch) finishBatch(); else if(!ob) closeSheet(); } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refreshWeather(); });

async function load(){
  state.items = await getAll("items");
  // relit chaque photo : format ArrayBuffer → Blob ; ancien format Blob → vérifié puis converti une fois pour toutes
  const lost=[], migrate=[];
  for(const it of state.items){
    it.photo=unpackBlob(it.photo); it.orig=unpackBlob(it.orig);
    for(const f of ["photo","orig"]){
      const b=it[f]; if(!(b instanceof Blob) || it.sample) continue;
      try{ const buf=await b.arrayBuffer(); if(!buf.byteLength) throw 0; it[f]=new Blob([buf],{type:b.type||"image/jpeg"}); migrate.push(it); }
      catch(e){ it[f]=null; if(f==="photo") lost.push(it); }
    }
    if(!it.photo && it.orig && lost.includes(it)){ it.photo=it.orig; it.orig=null; it.cut=false; lost.splice(lost.indexOf(it),1); migrate.push(it); }
  }
  for(const it of lost){ it.photoLost=true; it.review=true; migrate.push(it); }
  // on emballe d'abord (async), puis on écrit : une transaction IndexedDB se ferme dès qu'on attend autre chose qu'elle
  const packed=await Promise.all([...new Set(migrate)].map(packItem));
  for(const v of packed){ try{ await tx("items","readwrite",s=>s.put(v)); }catch(e){} }
  state.outfits = (await getAll("outfits")).sort((a,b)=>b.created-a.created);
  state.wears = (await getAll("wears")).sort((a,b)=>b.date-a.date);
  const p = await getOne("meta","prefs"); if(p) prefs={pairs:p.pairs||{},colors:p.colors||{}};
}
// filet de sécurité : une image qui ne se charge pas affiche un message au lieu de l'icône « ? » du navigateur
document.addEventListener("error",e=>{ const t=e.target; const p=t?.parentNode;
  if(t?.tagName==="IMG" && p?.classList?.contains("ph")){ p.classList.add("lost"); p.classList.remove("cut"); t.replaceWith(Object.assign(document.createElement("span"),{textContent:"Photo illisible : reprends-la"})); } },true);
(async()=>{
  document.getElementById("helpBtn").innerHTML=ICON.help;
  { const s=SKINS.find(x=>x.id===currentSkin()); if(s) document.querySelector('meta[name="theme-color"]').setAttribute("content",s.bg); }
  try{ await load(); }catch(e){ toast("Le stockage du navigateur est bloqué (navigation privée ?)."); }
  const fromIcon = applyCfgFromHash();
  render();
  let onboarded=false; try{ onboarded=localStorage.getItem("penderie.onboarded")==="1"; }catch(e){}
  if(!onboarded && !state.items.some(i=>!i.sample)) startOnboarding(false);
  else if(!onboarded){ try{ localStorage.setItem("penderie.onboarded","1"); }catch(e){} } // utilisateurs déjà installés : pas d'accueil
  if(fromIcon) toast("Tes réglages sont là. Tu peux ajouter tes vêtements !");
  if(!ob) refreshWeather(); // pendant l'accueil, la localisation n'est demandée qu'à l'étape météo
  if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
