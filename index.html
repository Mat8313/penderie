const ARCHETYPES = [
  ["haut","blanc","casual","toutes","T-shirt blanc"],["haut","blanc","chic","toutes","Chemise blanche"],["haut","marine","casual","toutes","T-shirt marine"],
  ["haut","bleu","chic","toutes","Chemise bleu ciel"],["bas","denim","casual","toutes","Jean brut"],["bas","noir","chic","toutes","Pantalon noir"],
  ["bas","beige","poly","mi","Chino beige"],["bas","gris","sport","toutes","Jogging gris"],["chaussures","blanc","casual","toutes","Baskets blanches"],
  ["chaussures","marron","chic","toutes","Derbies marron"],["chaussures","noir","chic","toutes","Chaussures noires"],["chaussures","gris","sport","toutes","Baskets de sport"],
  ["pull","gris","poly","mi","Pull gris"],["pull","marine","poly","hiver","Pull marine"],["pull","beige","casual","mi","Sweat beige"],
  ["veste","marine","chic","mi","Veste marine"],["veste","noir","casual","hiver","Doudoune noire"],["veste","camel","chic","hiver","Manteau camel"],["veste","kaki","casual","mi","Surchemise kaki"],
];
const CONTEXTS = ["chaud","doux","froid"].flatMap(w=>["casual","chic","sport"].map(o=>({weather:w,occ:o})));
const CTX_LABEL = c=>`${{chaud:"Chaud",doux:"Doux",froid:"Froid"}[c.weather]} · ${{casual:"décontracté",chic:"habillé",sport:"sport"}[c.occ]}`;
function countGood(items, ctx, cap){
  const H=eligible(items,"haut",ctx), B=eligible(items,"bas",ctx), S=eligible(items,"chaussures",ctx);
  if(!H.length||!B.length||!S.length) return 0;
  const V = ctx.weather==="chaud" ? [] : eligible(items,"veste",ctx);
  const J = ctx.weather==="froid" && V.length ? V : [null,...V];
  const P = ctx.weather==="chaud" ? [null] : [null,...eligible(items,"pull",ctx)];
  const total=H.length*B.length*S.length*J.length*P.length;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const n=Math.min(total,cap); let good=0, tried=0;
  const test=(p)=>{ tried++; const o=scoreOutfit(p,{...ctx,pin:null}); if(o.colorScore>=7 && !o.warn.length) good++; };
  if(total<=cap){ for(const h of H)for(const b of B)for(const s of S)for(const v of J)for(const pu of P){ if(pu&&h.season==="hiver") continue; test([v,pu,h,b,s].filter(Boolean)); } }
  else for(let k=0;k<n;k++){ const h=pick(H), pu=pick(P); test([pick(J),pu&&h.season!=="hiver"?pu:null,h,pick(B),pick(S)].filter(Boolean)); }
  return tried? Math.round(good/tried*total) : 0;
}
async function analyzeGaps(){
  const items=state.items.filter(i=>i.type!=="accessoire");
  state.gaps={busy:true, progress:0}; render();
  const base=CONTEXTS.map(c=>countGood(items,c,1500));
  const holes=CONTEXTS.map((c,i)=>({c,n:base[i],miss:generate(items,{...c,pin:null},new Set()).missing})).filter(x=>x.miss||x.n===0);
  const owned=a=>items.some(i=>i.type===a[0] && i.color===a[1] && (i.style===a[2]||i.style==="poly"||a[2]==="poly"));
  const sug=[];
  const arch=ARCHETYPES.filter(a=>!owned(a));
  for(let k=0;k<arch.length;k++){
    const a=arch[k], fake={id:"_x"+k,type:a[0],color:a[1],style:a[2],season:a[3],name:a[4]};
    let gain=0, fixes=0;
    for(let i=0;i<CONTEXTS.length;i++){ const n=countGood([...items,fake],CONTEXTS[i],1500); gain+=Math.max(0,n-base[i]); if(base[i]===0&&n>0) fixes++; }
    if(gain>0) sug.push({a,gain,fixes});
    state.gaps.progress=Math.round(100*(k+1)/arch.length);
    if(k%2===1){ render(); await new Promise(r=>setTimeout(r,0)); }
  }
  sug.sort((x,y)=>(y.fixes*1000+y.gain)-(x.fixes*1000+x.gain));
  // ceinture : utile seulement s'il n'y en a aucune du même cuir que tes chaussures habillées les plus courantes
  const belts=state.items.filter(i=>i.type==="accessoire"&&i.kind==="ceinture").map(i=>LEATHER(i.color));
  const leatherShoes=items.filter(i=>i.type==="chaussures"&&["brun","noir"].includes(LEATHER(i.color)));
  const beltTips=[...new Set(leatherShoes.map(s=>LEATHER(s.color)))].filter(l=>!belts.includes(l)).map(l=>l==="brun"?"Une ceinture marron, pour aller avec tes chaussures marron":"Une ceinture noire, pour aller avec tes chaussures noires");
  state.gaps={busy:false, holes, sug:sug.slice(0,4), beltTips, sig:state.items.length+":"+state.items.map(i=>i.id+i.color+i.type+i.style+i.season).join("").length, base:base.reduce((a,b)=>a+b,0)};
  render();
}
function gapsHtml(){
  const g=state.gaps;
  const sig=state.items.length+":"+state.items.map(i=>i.id+i.color+i.type+i.style+i.season).join("").length;
  if(!g || (!g.busy && g.sig!==sig)) return `<p class="sub" style="margin:0 0 10px">L'app teste toutes les combinaisons de ton dressing pour trouver les trous et les pièces qui débloqueraient le plus de tenues.</p><button class="btn primary" data-act="gaps" style="width:100%">Analyser mon dressing</button>`;
  if(g.busy) return `<div class="score-row"><div style="flex:1"><div class="ctl-label" style="margin:0 0 5px">Analyse des combinaisons… ${g.progress}%</div><div class="meter"><i style="width:${g.progress}%"></i></div></div></div>`;
  const holes = g.holes.length ? `<div class="gap-list">${g.holes.map(h=>`<div class="gap"><b>${CTX_LABEL(h.c)}</b><span>${h.miss?`il manque ${h.miss.join(", ")}`:"aucune tenue vraiment réussie"}</span></div>`).join("")}</div>` : `<p class="sub" style="margin:0">Tu as au moins une bonne tenue pour chaque météo et chaque occasion.</p>`;
  const sug = g.sug.length||g.beltTips.length ? `<div class="rank">${g.sug.map(s=>{ const f={type:s.a[0],color:s.a[1],kind:null}; return `<div class="rk"><div class="ph">${silhouette(f)}</div><div class="rk-b"><div class="rk-n"><span>${esc(s.a[4])}</span><b>+${s.gain}</b></div><span class="sub">${s.fixes?`comble ${s.fixes} trou${s.fixes>1?"s":""} · `:""}+${s.gain} tenue${s.gain>1?"s":""} réussie${s.gain>1?"s":""}</span></div></div>`; }).join("")}${g.beltTips.map(t=>`<div class="rk"><div class="ph">${silhouette({type:"accessoire",kind:"ceinture",color:t.includes("marron")?"marron":"noir"})}</div><div class="rk-b"><span>${t}</span></div></div>`).join("")}</div>`
    : `<p class="sub" style="margin:0">Rien d'évident à ajouter : ton dressing est bien équilibré.</p>`;
  return `<div class="ctl-label">Les trous</div>${holes}<div class="ctl-label" style="margin-top:14px">Ce qui ferait le plus de différence</div>${sug}
    <p class="sub" style="margin:10px 0 0">Aujourd'hui : environ ${g.base} combinaisons réussies, toutes météos et occasions confondues. <button class="link" data-act="gaps">Relancer</button></p>`;
}

/* ================= Mode valise ================= */
const VAL_KEY="penderie.valise";
const loadValise=()=>{ try{ return JSON.parse(localStorage.getItem(VAL_KEY)); }catch(e){ return null; } };
const saveValise=v=>{ try{ v?localStorage.setItem(VAL_KEY,JSON.stringify(v)):localStorage.removeItem(VAL_KEY); }catch(e){} };
let valForm={dest:"",days:5,chic:1,sport:0,weather:"auto"};
function openValiseForm(){
  openSheet(`<div class="grab"></div>
    <div class="sheet-h"><h2>Mode valise</h2><button class="icon-btn" data-act="close" aria-label="Fermer">${ICON.x}</button></div>
    <p class="sub" style="margin:0">L'app choisit le minimum de pièces qui donne une tenue différente chaque jour, selon la météo sur place.</p>
    <div class="field"><div class="ctl-label">Destination</div><input type="text" id="valDest" placeholder="ex. Lisbonne" value="${esc(valForm.dest)}" maxlength="60" autocomplete="off"></div>
    <div class="field"><div class="ctl-label">Météo</div>${seg("vweather",[["auto","Prévisions"],["chaud","Chaud"],["doux","Doux"],["froid","Froid"]],valForm.weather)}
      <span class="hint">« Prévisions » utilise la météo des prochains jours à destination (jusqu'à 16 jours).</span></div>
    <div class="steps">
      ${[["days","Nombre de jours",1,21],["chic","Soirées habillées",0,10],["sport","Séances de sport",0,10]].map(([k,l,mn,mx])=>`<div class="step"><span>${l}</span><div class="stepper"><button class="icon-btn" data-act="vstep" data-k="${k}" data-d="-1" aria-label="Moins">−</button><b id="v_${k}">${valForm[k]}</b><button class="icon-btn" data-act="vstep" data-k="${k}" data-d="1" aria-label="Plus">+</button></div></div>`).join("")}
    </div>
    <button class="btn primary" data-act="valgo">Préparer ma valise</button>`);
  document.getElementById("valDest").addEventListener("input",e=>{ valForm.dest=e.target.value; });
}
async function forecastFor(dest, n){
  const g=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(dest)}&count=1&language=fr&format=json`)).json();
  const r=g.results?.[0]; if(!r) throw new Error("ville");
  const d=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${r.latitude}&longitude=${r.longitude}&daily=apparent_temperature_max,apparent_temperature_min,precipitation_probability_max&timezone=auto&forecast_days=${Math.min(16,n)}`)).json();
  const days=d.daily.apparent_temperature_max.map((mx,i)=>{ const mn=d.daily.apparent_temperature_min[i]; return {weather:feelToWeather((2*mx+mn)/3), rain:(d.daily.precipitation_probability_max?.[i]??0)>=50, min:mn, max:mx}; });
  while(days.length<n) days.push({...days[days.length-1]}); // au-delà de 16 jours : on prolonge la dernière prévision
  return {place:r.name+(r.country?`, ${r.country}`:""), days};
}
async function buildValise(){
  const n=valForm.days;
  let place=valForm.dest.trim()||null, wdays;
  if(valForm.weather==="auto"){
    if(!place){ toast("Indique une destination, ou choisis la météo à la main."); return; }
    openSheet(`<div class="grab"></div><div class="sheet-h"><h2>Mode valise</h2></div><p class="sub">Récupération de la météo à ${esc(place)}…</p>`);
    try{ const f=await forecastFor(place,n); place=f.place; wdays=f.days; }
    catch(e){ toast(e.message==="ville"?"Destination introuvable. Vérifie l'orthographe.":"Météo indisponible. Choisis-la à la main."); openValiseForm(); return; }
  } else wdays=Array.from({length:n},()=>({weather:valForm.weather, rain:false}));
  // occasions : sport en début de séjour, soirées habillées en fin, le reste décontracté
  const occ=Array.from({length:n},()=>"casual");
  for(let i=0;i<Math.min(valForm.sport,n);i++) occ[i]="sport";
  for(let i=0;i<Math.min(valForm.chic,n);i++) if(occ[n-1-i]==="casual") occ[n-1-i]="chic";
  const items=state.items.filter(i=>i.type!=="accessoire");
  const chosen=new Set(), useCount={}, seen=new Set(), plan=[];
  for(let d=0; d<n; d++){
    const ctx={weather:wdays[d].weather, occ:occ[d], rain:wdays[d].rain, pin:null};
    const H=eligible(items,"haut",ctx), B=eligible(items,"bas",ctx), S=eligible(items,"chaussures",ctx);
    if(!H.length||!B.length||!S.length){ plan.push({...wdays[d],occ:occ[d],ids:[],acc:[],missing:true}); continue; }
    const V=ctx.weather==="chaud"?[]:eligible(items,"veste",ctx);
    const J=(ctx.weather==="froid"||ctx.rain)&&V.length?V:[null,...V];
    const P=ctx.weather==="chaud"?[null]:[null,...eligible(items,"pull",ctx)];
    let best=null, bs=-1e9;
    const consider=p=>{
      const k=p.map(x=>x.id).sort().join(","); if(seen.has(k)) return;
      const o=scoreOutfit(p,ctx); let s=o.s;
      for(const x of p){
        if(chosen.has(x.id)) s+=3; else s-=2.5;                       // réutiliser ce qui est déjà dans la valise
        const u=useCount[x.id]||0;
        if((x.type==="haut")&&u>=1) s-=4*u;                          // un haut ne se porte pas tous les jours
        if(x.type==="pull"&&u>=2) s-=3*u;
        if(x.type==="chaussures"&&!chosen.has(x.id)&&[...chosen].filter(id=>items.find(i=>i.id===id)?.type==="chaussures").length>=2) s-=5; // 3 paires max
      }
      if(s>bs){ bs=s; best={p,o,k}; }
    };
    const total=H.length*B.length*S.length*J.length*P.length, pick=a=>a[Math.floor(Math.random()*a.length)];
    if(total<=15000){ for(const h of H)for(const b of B)for(const s of S)for(const v of J)for(const pu of P){ if(pu&&h.season==="hiver") continue; consider([v,pu,h,b,s].filter(Boolean)); } }
    else for(let k=0;k<15000;k++){ const h=pick(H), pu=pick(P); consider([pick(J),pu&&h.season!=="hiver"?pu:null,h,pick(B),pick(S)].filter(Boolean)); }
    if(!best){ plan.push({...wdays[d],occ:occ[d],ids:[],acc:[],missing:true}); continue; }
    seen.add(best.k);
    for(const x of best.p){ chosen.add(x.id); useCount[x.id]=(useCount[x.id]||0)+1; }
    const acc=pickAccessories(state.items,best.p,ctx,null).map(a=>a.item.id);
    for(const id of acc) chosen.add(id);
    plan.push({...wdays[d],occ:occ[d],ids:best.p.map(x=>x.id),acc});
  }
  const v={created:Date.now(), place, nights:n, plan, packed:{}};
  saveValise(v); openValise(v);
}
function openValise(v){
  v=v||loadValise(); if(!v) return openValiseForm();
  const byId=Object.fromEntries(state.items.map(i=>[i.id,i]));
  const ids=[...new Set(v.plan.flatMap(d=>[...d.ids,...d.acc]))].filter(id=>byId[id]);
  const groups=[...MAIN_ORDER,"accessoire"].map(t=>({t,list:ids.map(id=>byId[id]).filter(i=>i.type===t)})).filter(g=>g.list.length);
  const packedN=ids.filter(id=>v.packed[id]).length;
  const OCCL={casual:"décontracté",chic:"habillé",sport:"sport"}, WL={chaud:"chaud",doux:"doux",froid:"froid"};
  openSheet(`<div class="grab"></div>
    <div class="sheet-h"><h2>Ta valise${v.place?` · ${esc(v.place)}`:""}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">${ICON.x}</button></div>
    <div class="stats"><div class="stat"><b>${ids.length}</b><span>pièces à emporter</span></div><div class="stat"><b>${v.plan.filter(d=>!d.missing).length}</b><span>tenues différentes</span></div><div class="stat"><b>${packedN}<small>/${ids.length}</small></b><span>déjà dans la valise</span></div></div>
    <div><div class="ctl-label">À emporter · touche une pièce quand elle est rangée</div>
      ${groups.map(g=>`<div class="pack-g"><span class="sub">${T[g.t].plural}</span><div class="pack">${g.list.map(i=>`<button class="pk ${v.packed[i.id]?"on":""}" data-act="pack" data-id="${i.id}" aria-pressed="${!!v.packed[i.id]}">${ph(i)}<span>${esc(itemName(i))}</span></button>`).join("")}</div></div>`).join("")}</div>
    <div><div class="ctl-label">Jour par jour</div><div class="favs">${v.plan.map((d,i)=>`<div class="fav"><div class="when">Jour ${i+1}<br>${WL[d.weather]}${d.min!=null?` ${Math.round(d.min)}–${Math.round(d.max)}°`:""}${d.rain?" · pluie":""}<br>${OCCL[d.occ]}</div><div class="thumbs">${d.missing?`<span class="sub">Pas de tenue possible pour ce jour : il manque des pièces adaptées.</span>`:[...d.ids,...d.acc].map(id=>byId[id]).filter(Boolean).map(ph).join("")}</div></div>`).join("")}</div></div>
    <div class="row2"><button class="btn ghost" data-act="valnew">Nouvelle valise</button><button class="btn danger" data-act="valdel">Vider</button></div>`);
}

/* ================= Événements ================= */
document.addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ state.tab=b.dataset.tab; render(); scrollTo(0,0); return; }
  if(b.dataset.seg==="vweather"){ valForm.weather=b.dataset.v; b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); return; }
  if(b.dataset.seg){
    if(b.dataset.seg==="weather"){
      if(b.dataset.v==="auto"){ state.ctx.wmode="auto"; saveCtx(); refreshWeather(); }
      else { state.ctx.wmode="manual"; state.ctx.weather=b.dataset.v; state.ctx.rain=false; }
    } else state.ctx[b.dataset.seg]=b.dataset.v;
    state.current=null; state.avoid.clear(); saveCtx(); render(); return;
  }
  if(b.dataset.skin){ applySkin(b.dataset.skin); b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); return; }
  if(b.dataset.filter){ state.filter=b.dataset.filter; render(); return; }
  if(b.dataset.f && sheetState){
    sheetState[b.dataset.f]=b.dataset.v; sheetState.touched?.add(b.dataset.f);
    if(b.dataset.f==="color2"){ sheetState.color2=b.dataset.v||null; }
    if(b.dataset.f==="color" && sheetState.color2===b.dataset.v) sheetState.color2=null;
    if(["type","kind","color"].includes(b.dataset.f)){ const sc=document.querySelector(".sheet")?.scrollTop||0; renderEditor(sheetState.isNew); const sh=document.querySelector(".sheet"); if(sh) sh.scrollTop=sc; return; }
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    if(b.dataset.f==="color"){ const p=document.querySelector(".photo-pick .ph"); if(p&&!sheetState.previewURL&&!sheetState.photo) p.outerHTML=ph(sheetState); }
    return;
  }
  const act=b.dataset.act; if(!act) return;
  const cur=state.current?.outfit;
  if(act==="add") openEditor(null);
  else if(act==="close") closeSheet();
  else if(act==="edit") openEditor(state.items.find(i=>i.id===b.dataset.id));
  else if(act==="save") saveItem();
  else if(act==="askdel") document.getElementById("delZone").innerHTML=`<div class="confirm"><span>Supprimer définitivement ?</span><button class="btn danger" data-act="del">Oui, supprimer</button><button class="btn ghost" data-act="nodel">Annuler</button></div>`;
  else if(act==="nodel") document.getElementById("delZone").innerHTML=`<button class="btn danger" data-act="askdel" style="width:100%">Supprimer cette pièce</button>`;
  else if(act==="del") deleteItem(sheetState.id);
  else if(act==="cutnow"){
    const s=sheetState; s.busy=true; s.hint=seen("cut")?"Détourage en cours…":"Détourage en cours… Premier détourage : téléchargement du modèle (~40 Mo, une seule fois)."; renderEditor(s.isNew);
    await doCutout(s, s.newPhoto!==undefined ? s.newPhoto : s.photo);
    if(sheetState!==s) return;
    s.busy=false; s.hint = s.cutFailed ? "Le détourage n'a pas pu se faire. Vérifie ta connexion et réessaie." : "Fond retiré. Enregistre pour garder cette version.";
    renderEditor(s.isNew);
  }
  else if(act==="pin"){ closeSheet(); state.ctx.pin=b.dataset.id; state.tab="tenue"; state.current=null; state.avoid.clear(); render(); scrollTo(0,0); }
  else if(act==="unpin"){ state.ctx.pin=null; state.current=null; render(); }
  else if(act==="next"){ if(cur) state.avoid.add(cur.k); state.current=generate(state.items,state.ctx,state.avoid); render(); }
  else if(act==="dislike"){ if(!cur) return; await learn(cur.pieces,-1); state.avoid.add(cur.k); state.current=generate(state.items,state.ctx,state.avoid); render(); toast("Noté, l'app évitera ce genre de tenue."); }
  else if(act==="fav"){
    const ex=state.outfits.find(f=>f.k===cur.k);
    if(ex){ await del("outfits",ex.id); state.outfits=state.outfits.filter(f=>f!==ex); await learn(cur.pieces,-1); toast("Retirée des favoris"); }
    else { const f={id:uid(),k:cur.k,ids:outfitAll(cur).map(p=>p.id),created:Date.now()}; await put("outfits",f); state.outfits.unshift(f); await learn(cur.pieces,1); toast("Tenue gardée en favori. L'app s'en souviendra."); }
    render();
  }
  else if(act==="wear"){
    const now=Date.now(), all=outfitAll(cur);
    for(const p of all){ const it=state.items.find(i=>i.id===p.id); it.lastWorn=now; p.lastWorn=now; await put("items",it); }
    const w={id:uid(),date:now,ids:all.map(p=>p.id)}; await put("wears",w); state.wears.unshift(w);
    await learn(cur.pieces,0.5);
    toast("Ajoutée à ton historique. Ces pièces passeront après les autres pendant 2 jours.");
  }
  else if(act==="delwear"){ await del("wears",b.dataset.id); state.wears=state.wears.filter(w=>w.id!==b.dataset.id); render(); }
  else if(act==="showfav"){
    const f=state.outfits.find(x=>x.id===b.dataset.id); const all=f.ids.map(id=>state.items.find(i=>i.id===id));
    const pieces=all.filter(p=>p.type!=="accessoire"), acc=all.filter(p=>p.type==="accessoire").map(item=>({item}));
    state.current={outfit:{pieces,acc,k:f.k,...scoreOutfit(pieces,state.ctx)}}; render(); scrollTo({top:0,behavior:"smooth"});
  }
  else if(act==="unfav"){ await del("outfits",b.dataset.id); state.outfits=state.outfits.filter(f=>f.id!==b.dataset.id); render(); }
  else if(act==="wxauto"){ state.ctx.wmode="auto"; saveCtx(); refreshWeather(); }
  else if(act==="wxretry") refreshWeather(true);
  else if(act==="menu") openMenu();
  else if(act==="togglecut"){ settings.cutout=!settings.cutout; saveSettings(); b.setAttribute("aria-pressed",settings.cutout); }
  else if(act==="askreset") document.getElementById("prefZone").innerHTML=`<div class="confirm"><span>Oublier tous les goûts appris ?</span><button class="btn danger" data-act="resetprefs">Oui, réinitialiser</button></div>`;
  else if(act==="resetprefs"){ prefs={pairs:{},colors:{}}; await put("meta",{key:"prefs",...prefs}); state.current=null; closeSheet(); render(); toast("Goûts appris réinitialisés"); }
  else if(act==="backup") shareBackup();
  else if(act==="snooze"){ const k=BK.get(); k.snooze=Date.now()+3*DAY; BK.set(k); render(); }
  else if(act==="stopbatch"){ if(batch) batch.cancel=true; }
  else if(act==="gaps") analyzeGaps();
  else if(act==="valise") openValise();
  else if(act==="valnew") openValiseForm();
  else if(act==="valdel"){ saveValise(null); closeSheet(); render(); }
  else if(act==="valgo") buildValise();
  else if(act==="vstep"){ const k=b.dataset.k, lim={days:[1,21],chic:[0,10],sport:[0,10]}[k]; valForm[k]=Math.max(lim[0],Math.min(lim[1],valForm[k]+Number(b.dataset.d))); document.getElementById("v_"+k).textContent=valForm[k]; }
  else if(act==="pack"){ const v=loadValise(); v.packed[b.dataset.id]=!v.packed[b.dataset.id]; saveValise(v); const sc=document.querySelector(".sheet").scrollTop; openValise(v); document.querySelector(".sheet").scrollTop=sc; }
  else if(act==="samples") loadSamples();
  else if(act==="clearsamples") clearSamples();
  else if(act==="import") document.getElementById("importFile").click();
});
document.getElementById("addBtn").addEventListener("click",()=>openEditor(null));
document.getElementById("importFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) importData(f); e.target.value=""; });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refreshWeather(); });

async function load(){
  state.items = await getAll("items");
  state.outfits = (await getAll("outfits")).sort((a,b)=>b.created-a.created);
  state.wears = (await getAll("wears")).sort((a,b)=>b.date-a.date);
  const p = await getOne("meta","prefs"); if(p) prefs={pairs:p.pairs||{},colors:p.colors||{}};
}
(async()=>{
  { const s=SKINS.find(x=>x.id===currentSkin()); if(s) document.querySelector('meta[name="theme-color"]').setAttribute("content",s.bg); }
  try{ await load(); }catch(e){ toast("Le stockage du navigateur est bloqué (navigation privée ?)."); }
  render();
  refreshWeather();
  if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
