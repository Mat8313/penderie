<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Penderie</title>
<meta name="theme-color" content="#2b1016">
<meta name="description" content="Numérise ton dressing et reçois des idées de tenues qui vont ensemble.">
<meta property="og:title" content="Penderie">
<meta property="og:description" content="Ton dressing, des tenues qui vont ensemble.">
<meta property="og:image" content="https://mat8313.github.io/penderie/og.png">
<meta property="og:url" content="https://mat8313.github.io/penderie/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Penderie">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var k=localStorage.getItem("penderie.skin");if(k)document.documentElement.dataset.skin=k}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout : app mobile à une colonne, barre d'onglets en bas. Thèmes au choix via data-skin sur <html> (réglages). */
:root{
  --bg:#2b1016; --g1:#9a2f3a; --g2:#6a1f38; --surface:rgba(70,22,30,.62); --surface-solid:#34141b; --tile:#1c080c;
  --ink:#fbeeed; --muted:#d3aeb2; --accent:#ff4a3d; --accent-rgb:255,74,61; --accent-soft:#ff6b5f; --accent-ink:#fff3f1;
  --good:#ff7a6e; --bad:#ffb26b; --chip:rgba(255,255,255,.08); --nav:rgba(43,16,22,.82); --scrim:rgba(10,2,4,.55);
  --swatch-line:rgba(255,255,255,.3); --sil:rgba(255,255,255,.25);
  --glow:0 0 6px rgba(var(--accent-rgb),.55),0 0 18px rgba(var(--accent-rgb),.25);
  --line:rgba(var(--accent-rgb),.18);
  --display:"Cormorant Garamond", "Times New Roman", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tab-h:64px; color-scheme:dark;
}
:root[data-skin="minuit"]{ /* l'ambiance d'origine, plus sombre */
  --bg:#130709; --g1:#5a1a21; --g2:#3a1220; --surface:rgba(32,12,16,.78); --surface-solid:#1d0b0f; --tile:#0c0405;
  --ink:#f4e7e6; --muted:#b9959a; --accent:#ff3e32; --accent-rgb:255,62,50; --accent-soft:#d8453a; --nav:rgba(19,7,9,.82); --scrim:rgba(5,1,2,.6); --chip:rgba(255,255,255,.06)}
:root[data-skin="rose"]{
  --bg:#fbefee; --g1:#ffd3cc; --g2:#f7d6e4; --surface:rgba(255,255,255,.78); --surface-solid:#fff8f7; --tile:#ffffff;
  --ink:#2b1316; --muted:#80595d; --accent:#e0352b; --accent-rgb:224,53,43; --accent-soft:#c42f26; --accent-ink:#fff;
  --good:#d6453b; --bad:#c26a12; --chip:rgba(80,20,25,.06); --nav:rgba(255,248,247,.86); --scrim:rgba(60,20,25,.3);
  --swatch-line:rgba(0,0,0,.18); --sil:rgba(0,0,0,.25); --glow:0 0 0 1px rgba(var(--accent-rgb),.08),0 4px 14px rgba(var(--accent-rgb),.18); color-scheme:light}
:root[data-skin="ocean"]{
  --bg:#13233a; --g1:#2a6aa0; --g2:#33307a; --surface:rgba(28,48,78,.62); --surface-solid:#182a44; --tile:#0b1626;
  --ink:#eaf3fb; --muted:#a7bdd2; --accent:#45c9ff; --accent-rgb:69,201,255; --accent-soft:#7ed8ff;
  --good:#6fd3ff; --bad:#ffb26b; --nav:rgba(19,35,58,.84)}
:root[data-skin="foret"]{
  --bg:#16261c; --g1:#3c7a4e; --g2:#4a4a24; --surface:rgba(34,60,42,.6); --surface-solid:#1c3124; --tile:#0c1710;
  --ink:#eef6ef; --muted:#adc6b2; --accent:#7ee894; --accent-rgb:126,232,148; --accent-soft:#a3f0b3;
  --good:#8ff0a4; --bad:#ffc06b; --nav:rgba(22,38,28,.84)}
:root[data-skin="synthwave"]{
  --bg:#221438; --g1:#8a35a8; --g2:#2f3a8a; --surface:rgba(52,30,84,.6); --surface-solid:#2a1a44; --tile:#120a20;
  --ink:#f6eefc; --muted:#c5addb; --accent:#ff52da; --accent-rgb:255,82,218; --accent-soft:#ff86e6;
  --good:#ff7ae3; --bad:#ffd166; --nav:rgba(34,20,56,.84)}
:root[data-skin="epure"]{
  --bg:#f4f5f7; --g1:#e3e7ee; --g2:#eceef3; --surface:rgba(255,255,255,.9); --surface-solid:#ffffff; --tile:#ffffff;
  --ink:#161b22; --muted:#5d6675; --accent:#1c2430; --accent-rgb:28,36,48; --accent-soft:#1c2430; --accent-ink:#fff;
  --good:#2c8a57; --bad:#c2410c; --chip:rgba(0,0,0,.05); --nav:rgba(255,255,255,.9); --scrim:rgba(10,14,20,.35);
  --swatch-line:rgba(0,0,0,.18); --sil:rgba(0,0,0,.25); --glow:0 1px 3px rgba(0,0,0,.12); color-scheme:light}
:root{--statusbar:transparent}
:root[data-skin="rose"]{--statusbar:#4a1d22}
:root[data-skin="epure"]{--statusbar:#161b22}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--statusbar)}
.tips{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.tips summary{cursor:pointer;font-weight:600;color:var(--accent-soft);list-style:none;display:flex;justify-content:space-between;align-items:center}
.tips summary::-webkit-details-marker{display:none}
.tips summary::after{content:"+";font-size:20px;line-height:1}
.tips[open] summary::after{content:"−"}
.tips ul{margin:10px 0 2px;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.tips b{color:var(--ink);font-weight:600}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.skin{border:1px solid var(--line);background:var(--tile);border-radius:14px;padding:10px 8px;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:500}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),var(--glow)}
.skin .pv{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(0,0,0,.15)}
.skin .pv i{width:16px;height:16px;border-radius:50%}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(90% 55% at 85% 0%,var(--g1) 0%,transparent 60%),radial-gradient(80% 50% at 0% 100%,var(--g2) 0%,transparent 60%);background-attachment:fixed;font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
h1{font:600 40px/1 var(--display);letter-spacing:.01em;margin:0;color:var(--accent-soft)}
h2{font:600 25px/1.1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--accent);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

/* Segments */
.controls{display:grid;gap:10px;margin-block:14px}
.ctl-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--tile);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.55),var(--glow)}

/* Tenue */
.outfit{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:12px}
.flatlay{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.flatlay .piece{position:relative}
.flatlay .piece.wide{grid-column:span 2}
.ph{border-radius:14px;overflow:hidden;background:var(--chip);display:grid;place-items:center}
.piece .ph{aspect-ratio:1}
.piece.wide .ph{aspect-ratio:2/1}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:62%;height:62%}
.piece .cap{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;min-width:0}
.piece .cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--swatch-line)}
.dot.motif,.sw.motif{background:linear-gradient(135deg,#c63a2f 0 25%,#e9c449 25% 50%,#3e7d4f 50% 75%,#3b7fd4 75%)}
.score-row{display:flex;align-items:center;gap:12px}
.meter{flex:1;height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);box-shadow:var(--glow);border-radius:99px;transition:width .4s}
.score{font:700 30px/1 var(--display);color:var(--accent-soft);font-variant-numeric:tabular-nums}
.score small{font:500 13px var(--body);color:var(--muted)}
.why{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.why li{display:flex;gap:8px;align-items:flex-start}
.why li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--good)}
.why li.warn::before{background:var(--bad)}
.actions{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;background:var(--chip);white-space:nowrap}
.btn.primary{background:var(--tile);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),var(--glow);text-shadow:0 0 8px rgba(var(--accent-rgb),.6)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn svg{width:18px;height:18px;vertical-align:-3px}
.empty{border:1.5px dashed var(--line);border-radius:20px;padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty p{margin:0;color:var(--muted);max-width:34ch}

/* Favoris */
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.favs{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.fav{display:flex;align-items:center;gap:8px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:8px}
.fav .thumbs{display:flex;gap:4px;flex:1;min-width:0;border:0;background:none;padding:0;overflow-x:auto;scrollbar-width:none}
.fav .thumbs::-webkit-scrollbar{display:none}
.fav .thumbs .ph{width:48px;height:48px;border-radius:10px;flex:none}
.fav .icon-btn{width:36px;height:36px;border:0;background:transparent;color:var(--muted)}

/* Dressing */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:14px -2px 12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;white-space:nowrap;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--tile);color:var(--accent);border-color:var(--accent);box-shadow:var(--glow)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.6;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tag{border:0;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:8px;text-align:left;border:1px solid var(--line);position:relative}
.tag .ph{aspect-ratio:1;border-radius:11px}
.tag .meta{padding:8px 4px 2px;display:grid;gap:2px;min-width:0}
.tag .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .ty{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.tag .hole{position:absolute;top:14px;left:14px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:1.5px solid rgba(var(--accent-rgb),.45);z-index:1}
.badge{position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;background:var(--tile);color:var(--accent);border:1px solid var(--accent);padding:2px 7px;border-radius:99px}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;height:var(--tab-h);display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;gap:4px}
nav.tabs button.t{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px}
nav.tabs button.t svg{width:22px;height:22px}
nav.tabs button.t[aria-current="page"]{color:var(--accent)}
nav.tabs button.t[aria-current="page"] svg{filter:drop-shadow(0 0 4px rgba(var(--accent-rgb),.8))}
.fab{width:58px;height:58px;border-radius:18px;border:1px solid rgba(var(--accent-rgb),.35);background:var(--tile);color:var(--accent);display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 18px rgba(var(--accent-rgb),.25)}
.fab svg{filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),.9))}
.fab svg{width:26px;height:26px}

/* Feuille modale */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface-solid);border-top:1px solid var(--line);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.meter i{transition:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.photo-pick{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.photo-pick .ph{width:110px;height:110px;border-radius:14px}
.photo-pick label.btn{display:inline-block;text-align:center}
.field{display:grid;gap:6px}
.field input[type=text]{border:1px solid var(--line);background:var(--tile);border-radius:12px;padding:11px 12px;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.swb{border:1px solid var(--line);background:var(--tile);border-radius:12px;padding:8px 4px 6px;display:grid;justify-items:center;gap:4px;font-size:11px;line-height:1.15;text-align:center}
.swb[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),var(--glow)}
.sw.none{background:linear-gradient(135deg,transparent 46%,var(--muted) 46% 54%,transparent 54%)}
.swb.alt{border-style:dashed;border-color:rgba(var(--accent-rgb),.7)}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--swatch-line)}
.hint{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu{display:grid;gap:8px}
.menu .btn{white-space:normal;text-align:left;display:flex;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));background:var(--tile);color:var(--ink);border:1px solid rgba(var(--accent-rgb),.5);box-shadow:var(--glow);
  padding:10px 16px;border-radius:12px;font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.wx{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.wx svg{width:15px;height:15px;color:var(--accent);flex:none;vertical-align:-3px}
.wx b{color:var(--ink);font-weight:600}
.wx.warn{color:var(--bad)}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600;text-decoration:underline;font-size:inherit}
.pinbar{display:flex;align-items:center;gap:10px;background:var(--tile);border:1px solid var(--accent);border-radius:14px;padding:8px;margin-bottom:12px;box-shadow:var(--glow)}
.pinbar .ph{width:44px;height:44px;border-radius:10px;flex:none}
.pinbar span{flex:1;min-width:0;font-size:14px}
.accrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ph.cut img{object-fit:contain;padding:8%}
.btn.sq{padding:12px}
.btn.sm{padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:grid;gap:4px;align-content:start}
.stat b{font:700 30px/1 var(--display);color:var(--accent-soft);font-variant-numeric:tabular-nums}
.stat small{font-size:16px}
.stat span{font-size:12px;color:var(--muted);line-height:1.3}
.fav .when{font-size:12px;color:var(--muted);width:74px;flex:none;line-height:1.25;padding-left:4px;overflow-wrap:anywhere}
.rank{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.rk{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.rk .ph{width:48px;height:48px;border-radius:10px;flex:none}
.rk-b{flex:1;min-width:0;display:grid;gap:6px}
.rk-n{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.rk-n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-n b{font-variant-numeric:tabular-nums}
.colorbar{display:flex;height:22px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.colorbar i{display:block}
.colorbar i.motif{background:linear-gradient(135deg,#c63a2f 0 25%,#e9c449 25% 50%,#3e7d4f 50% 75%,#3b7fd4 75%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid var(--line);background:var(--tile);border-radius:14px;padding:12px 14px;width:100%}
.toggle i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--chip);position:relative;border:1px solid var(--line)}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s}
.toggle[aria-pressed="true"] i{background:rgba(var(--accent-rgb),.25);border-color:var(--accent)}
.toggle[aria-pressed="true"] i::after{transform:translateX(18px);background:var(--accent);box-shadow:var(--glow)}
@media (max-width:360px){.seg button{font-size:13px;padding:8px 2px}}
.bk{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--tile);border:1px solid rgba(var(--accent-rgb),.5);border-radius:14px;padding:10px 12px;margin-top:12px;box-shadow:var(--glow);flex-wrap:wrap}
.bk>div:first-child{display:grid;gap:2px;min-width:0;flex:1 1 200px}
.bk b{font-size:14px}
.bk-a{display:flex;align-items:center;gap:12px}

.gap span{color:var(--muted)}
.valcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.valcard>span:last-child{display:grid;gap:2px;min-width:0}
.valcard b{font:600 20px/1.1 var(--display)}
.vi{width:44px;height:44px;border-radius:12px;background:var(--tile);display:grid;place-items:center;color:var(--accent);flex:none;border:1px solid var(--line)}

.steps{display:grid;gap:8px}

.pk{border:1px solid var(--line);background:var(--tile);border-radius:12px;padding:5px;display:grid;gap:4px;font-size:11px;text-align:center;position:relative}

.pk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.on{opacity:.45}
.pk.on::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--accent);font-weight:700;font-size:16px;text-shadow:0 0 6px rgba(var(--accent-rgb),.8)}
</style>

<script>
"use strict";
/* ================= Données de référence ================= */
const TYPES = [
  {id:"haut", label:"Haut", plural:"Hauts"},
  {id:"bas", label:"Bas", plural:"Bas"},
  {id:"chaussures", label:"Chaussures", plural:"Chaussures"},
  {id:"pull", label:"Pull / sweat / gilet", plural:"Pulls & sweats"},
  {id:"veste", label:"Veste / manteau", plural:"Vestes"},
  {id:"accessoire", label:"Accessoire", plural:"Accessoires"},
];
const KINDS = [
  {id:"casquette", label:"Casquette / chapeau", short:"Casquette"},
  {id:"bonnet", label:"Bonnet", short:"Bonnet"},
  {id:"echarpe", label:"Écharpe", short:"Écharpe"},
  {id:"ceinture", label:"Ceinture", short:"Ceinture"},
  {id:"montre", label:"Montre", short:"Montre"},
  {id:"lunettes", label:"Lunettes de soleil", short:"Lunettes"},
  {id:"sac", label:"Sac", short:"Sac"},
  {id:"bijou", label:"Bijou", short:"Bijou"},
];
const COLORS = [
  {id:"noir",label:"Noir",hex:"#1c1c1e",fam:"neutre"},
  {id:"blanc",label:"Blanc",hex:"#f5f5f2",fam:"neutre"},
  {id:"gris",label:"Gris",hex:"#8b8f96",fam:"neutre"},
  {id:"beige",label:"Beige",hex:"#d8c6a5",fam:"neutre"},
  {id:"marine",label:"Marine",hex:"#1f2b47",fam:"neutre"},
  {id:"denim",label:"Jean",hex:"#4b6a8f",fam:"neutre"},
  {id:"kaki",label:"Kaki",hex:"#6c6c3e",fam:"terre"},
  {id:"marron",label:"Marron",hex:"#6b4631",fam:"terre"},
  {id:"camel",label:"Camel",hex:"#b98a52",fam:"terre"},
  {id:"bordeaux",label:"Bordeaux",hex:"#6e1f2d",fam:"vif"},
  {id:"rouge",label:"Rouge",hex:"#c63a2f",fam:"vif"},
  {id:"rose",label:"Rose",hex:"#e8a3b3",fam:"vif"},
  {id:"orange",label:"Orange",hex:"#e07c2c",fam:"vif"},
  {id:"jaune",label:"Jaune",hex:"#e9c449",fam:"vif"},
  {id:"vert",label:"Vert",hex:"#3e7d4f",fam:"vif"},
  {id:"bleu",label:"Bleu",hex:"#3b7fd4",fam:"vif"},
  {id:"violet",label:"Violet",hex:"#7b4fa1",fam:"vif"},
  {id:"motif",label:"Motif",hex:null,fam:"motif"},
];
const STYLES = [
  {id:"casual",label:"Décontracté"},
  {id:"chic",label:"Habillé"},
  {id:"sport",label:"Sport"},
  {id:"poly",label:"Passe-partout"},
];
const SEASONS = [
  {id:"ete",label:"Été"},
  {id:"mi",label:"Mi-saison"},
  {id:"hiver",label:"Hiver"},
  {id:"toutes",label:"Toute l'année"},
];
const C = Object.fromEntries(COLORS.map(c=>[c.id,c]));
const T = Object.fromEntries(TYPES.map(t=>[t.id,t]));
const K = Object.fromEntries(KINDS.map(k=>[k.id,k]));
const MAIN_ORDER = ["veste","pull","haut","bas","chaussures"];

/* ================= Moteur de suggestion ================= */
const key = (a,b)=>[a,b].sort().join("|");
const CLASH = new Set(["rouge|rose","orange|rouge","rouge|vert","orange|rose","jaune|violet","orange|violet","bordeaux|rouge","rose|vert","jaune|rose","bordeaux|rose","bordeaux|orange"].map(k=>key(...k.split("|"))));
const NICE = new Set(["bleu|camel","camel|vert","bordeaux|camel","bordeaux|marron","bleu|marron","kaki|orange","bordeaux|kaki","camel|rouge"].map(k=>key(...k.split("|"))));

function pairColor(a,b){
  const A=C[a], B=C[b];
  if(a===b){
    if(a==="denim") return {s:-1, warn:"Total look jean : ça passe, mais c'est risqué"};
    if(a==="motif") return {s:-3, warn:"Deux pièces à motifs se battent entre elles"};
    return {s:1.5, ok:"Ton sur ton en "+A.label.toLowerCase()};
  }
  if(A.fam==="motif"||B.fam==="motif"){
    const other = A.fam==="motif"?B:A;
    if(other.fam==="neutre") return {s:1.5};
    return {s:-2.5, warn:"Le motif et le "+other.label.toLowerCase()+" chargent la tenue"};
  }
  if(A.fam==="neutre"||B.fam==="neutre") return {s:2};
  if(NICE.has(key(a,b))) return {s:2.2, ok:A.label+" et "+B.label.toLowerCase()+" : association classique"};
  if(A.fam==="terre"&&B.fam==="terre") return {s:1.5, ok:"Palette de tons terre cohérente"};
  if(A.fam==="terre"||B.fam==="terre") return {s:1};
  if(CLASH.has(key(a,b))) return {s:-3, warn:A.label+" et "+B.label.toLowerCase()+" se heurtent"};
  return {s:-0.5};
}
const STY = {
  casual:{casual:2,chic:.5,sport:1,poly:1.5},
  chic:{casual:.5,chic:2,sport:-4,poly:1.5},
  sport:{casual:1,chic:-4,sport:2,poly:1},
  poly:{casual:1.5,chic:1.5,sport:1,poly:1.5},
};
const OCC = { // bonus par pièce selon l'occasion (null = exclu)
  casual:{casual:1,poly:1,sport:0,chic:0},
  chic:{chic:2,poly:1,casual:-1.5,sport:null},
  sport:{sport:2,casual:.5,poly:.5,chic:null},
};
const SEA = { // adéquation météo (null = exclu)
  chaud:{ete:1,toutes:.5,mi:0,hiver:null},
  doux:{mi:1,toutes:.5,ete:0,hiver:-.5},
  froid:{hiver:1,mi:.5,toutes:.5,ete:null},
};
const DAY = 864e5;

/* Préférences apprises : chaque j'aime / j'aime pas / « je la porte » ajuste un poids
   par paire de pièces et par paire de couleurs. Le score d'une tenue en tient compte. */
let prefs = {pairs:{}, colors:{}};
function prefScore(pieces){
  let s=0;
  for(let i=0;i<pieces.length;i++) for(let j=i+1;j<pieces.length;j++){
    s += (prefs.pairs[key(pieces[i].id,pieces[j].id)]||0)*0.6;
    s += (prefs.colors[key(pieces[i].color,pieces[j].color)]||0)*0.25;
  }
  return s;
}
async function learn(pieces, w){
  const clamp=v=>Math.max(-6,Math.min(6,v));
  for(let i=0;i<pieces.length;i++) for(let j=i+1;j<pieces.length;j++){
    const kp=key(pieces[i].id,pieces[j].id), kc=key(pieces[i].color,pieces[j].color);
    prefs.pairs[kp]=clamp((prefs.pairs[kp]||0)+w);
    prefs.colors[kc]=clamp((prefs.colors[kc]||0)+w*0.5);
  }
  try{ await put("meta",{key:"prefs",...prefs}); }catch(e){}
}

function scoreOutfit(pieces, ctx){
  let s=0, cs=0, n=0; const ok=[], warn=[];
  for(let i=0;i<pieces.length;i++) for(let j=i+1;j<pieces.length;j++){
    const p = pairColor(pieces[i].color, pieces[j].color);
    cs+=p.s; n++;
    if(p.ok&&!ok.includes(p.ok)) ok.push(p.ok);
    if(p.warn&&!warn.includes(p.warn)) warn.push(p.warn);
    const st = STY[pieces[i].style][pieces[j].style];
    s+=st;
    if(st<0 && !warn.some(w=>w.startsWith("Mélange"))) warn.push("Mélange sport et habillé");
  }
  s+=cs;
  // Couleur secondaire : compte moins que la principale, mais un « rappel » (le bleu des baskets
  // qui répond au bleu du pull) est un vrai plus ; un choc de couleurs reste signalé.
  const echoed=new Set();
  for(const a of pieces){
    if(!a.color2) continue;
    for(const b of pieces){
      if(a===b) continue;
      const pc=pairColor(a.color2,b.color);
      s+=pc.s*0.35;
      if(pc.s<=-2.5 && !warn.includes(pc.warn)) warn.push(pc.warn);
      const fam=C[a.color2].fam;
      if(fam!=="neutre" && (b.color===a.color2 || b.color2===a.color2) && !echoed.has(a.color2)){
        echoed.add(a.color2); s+=2; cs+=n*0.6;
        const OF={haut:"du haut",pull:"du pull",bas:"du bas",chaussures:"des chaussures",veste:"de la veste",accessoire:"de l'accessoire"};
        const THE={haut:"le haut",pull:"le pull",bas:"le bas",chaussures:"les chaussures",veste:"la veste",accessoire:"l'accessoire"};
        ok.unshift(`Le ${C[a.color2].label.toLowerCase()} ${a.name?"de "+a.name:OF[a.type]} rappelle ${b.name?b.name:THE[b.type]}`);
      }
    }
  }
  const vifs = [...new Set([...pieces.map(p=>p.color), ...pieces.map(p=>p.color2).filter(c=>c&&!echoed.has(c))].filter(c=>c&&C[c].fam==="vif"))];
  if(vifs.length>2){ s-=3; warn.push("Trop de couleurs vives à la fois"); }
  const fams = pieces.map(p=>C[p.color].fam);
  if(fams.every(f=>f==="neutre")) ok.unshift("Palette 100 % neutre, impossible de se tromper");
  else if(vifs.length===1 && fams.filter(f=>f==="vif").length===1 && !echoed.size) ok.unshift("Une seule couleur forte ("+C[vifs[0]].label.toLowerCase()+"), le reste neutre : équilibré");
  for(const p of pieces){
    s+=(OCC[ctx.occ][p.style]??-3)+(SEA[ctx.weather][p.season]??-2);
    if(p.lastWorn && Date.now()-p.lastWorn < 2*DAY && p.id!==ctx.pin) s-=3;
  }
  const pull=pieces.find(p=>p.type==="pull"), haut=pieces.find(p=>p.type==="haut");
  if(pull && haut){
    if(ctx.weather==="froid"){ s+=1; ok.push("Superposition : "+itemName(pull).toLowerCase()+" par-dessus "+itemName(haut).toLowerCase()); }
    if(haut.season==="hiver"){ s-=6; warn.push("Deux couches épaisses l'une sur l'autre"); }
  }
  const ps = prefScore(pieces); s+=ps;
  if(ps>=1.5) ok.unshift("Dans l'esprit des tenues que tu as aimées");
  else if(ps<=-1.5) warn.unshift("Ressemble à des tenues que tu n'as pas aimées");
  const styles=new Set(pieces.map(p=>p.style).filter(x=>x!=="poly"));
  if(styles.size<=1 && !warn.length) ok.push("Pièces du même registre de style");
  const colorScore = Math.max(1, Math.min(10, Math.round(((cs/Math.max(n,1))+3)/5.2*10)));
  return {s, colorScore, ok:ok.slice(0,3), warn:warn.slice(0,2)};
}

function eligible(items, type, ctx){
  return items.filter(i=>i.type===type && OCC[ctx.occ][i.style]!==null && SEA[ctx.weather][i.season]!==null);
}
function generate(items, ctx, avoid){
  const pin = ctx.pin ? items.find(i=>i.id===ctx.pin) : null;
  const pool = (type)=> pin && pin.type===type ? [pin] : eligible(items,type,ctx);
  const H=pool("haut"), B=pool("bas"), S=pool("chaussures");
  const V = pin?.type==="veste" ? [pin] : (ctx.weather==="chaud" ? [] : eligible(items,"veste",ctx));
  const missing=[]; if(!H.length)missing.push("un haut"); if(!B.length)missing.push("un bas"); if(!S.length)missing.push("une paire de chaussures");
  if(missing.length) return {missing};
  const needJacket = (ctx.weather==="froid" || (ctx.rain && ctx.weather!=="chaud")) && V.length;
  const jackets = pin?.type==="veste" || needJacket ? V : [null,...V];
  const pulls = pin?.type==="pull" ? [pin] : ctx.weather==="chaud" ? [null] : [null,...eligible(items,"pull",ctx)]; // couche intermédiaire facultative
  const total = H.length*B.length*S.length*jackets.length*pulls.length;
  const pick = a=>a[Math.floor(Math.random()*a.length)];
  const combos=[];
  if(total<=20000){
    for(const h of H)for(const b of B)for(const sh of S)for(const v of jackets)for(const pu of pulls){ if(pu&&h.season==="hiver") continue; combos.push([v,pu,h,b,sh].filter(Boolean)); }
  } else {
    for(let k=0;k<20000;k++){ const hh=pick(H); const pu=pick(pulls); if(pu&&hh.season==="hiver"&&pin?.type!=="pull") { combos.push([pick(jackets),hh,pick(B),pick(S)].filter(Boolean)); continue; } combos.push([pick(jackets),pu,hh,pick(B),pick(S)].filter(Boolean)); }
  }
  if(!combos.length) return {missing:["un haut léger à porter sous ce pull"]};
  const scored = combos.map(p=>({pieces:p, ...scoreOutfit(p,ctx), k:p.map(x=>x.id).sort().join(",")}));
  scored.sort((a,b)=>b.s-a.s);
  let cand = scored.filter(o=>!avoid.has(o.k));
  if(!cand.length){ avoid.clear(); cand=scored; }
  const top = cand.slice(0,5);
  // tirage pondéré parmi les meilleures pour varier sans sacrifier la qualité
  const w = top.map((o,i)=>5-i), tot=w.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot, chosen=top[0];
  for(let i=0;i<top.length;i++){ r-=w[i]; if(r<=0){ chosen=top[i]; break; } }
  chosen.acc = pickAccessories(items, chosen.pieces, ctx, pin?.type==="accessoire"?pin:null);
  return {outfit:chosen, noJacket: ctx.weather==="froid" && !V.length};
}

/* Accessoires : choisis après la tenue principale, au plus 3, avec quelques règles de bon sens. */
const KIND_RULES = {
  bonnet:{weather:["froid"], occ:["casual","sport"]},
  echarpe:{weather:["froid","doux"]},
  lunettes:{weather:["chaud","doux"], dry:true},
  casquette:{occ:["casual","sport"]},
  ceinture:{occ:["casual","chic"]},
};
const LEATHER = c=> c==="marron"||c==="camel" ? "brun" : c==="noir" ? "noir" : c;
function pickAccessories(items, pieces, ctx, pinAcc){
  const shoes=pieces.find(p=>p.type==="chaussures"), bas=pieces.find(p=>p.type==="bas");
  const cands = items.filter(i=>i.type==="accessoire" && i!==pinAcc && OCC[ctx.occ][i.style]!==null && SEA[ctx.weather][i.season]!==null).filter(i=>{
    const r=KIND_RULES[i.kind]||{};
    if(r.weather && !r.weather.includes(ctx.weather)) return false;
    if(r.occ && !r.occ.includes(ctx.occ)) return false;
    if(r.dry && ctx.rain) return false;
    if(i.kind==="ceinture" && (!bas || bas.style==="sport")) return false;
    return true;
  }).map(a=>{
    let s=0, note=null;
    for(const p of pieces){ s+=pairColor(a.color,p.color).s*0.5 + STY[a.style][p.style]*0.3; }
    s/=Math.max(1,pieces.length); s+=OCC[ctx.occ][a.style];
    if(a.kind==="ceinture" && shoes){
      if(LEATHER(a.color)===LEATHER(shoes.color)){ s+=3; note="Ceinture assortie aux chaussures"; }
      else if(["brun","noir"].includes(LEATHER(a.color)) && ["brun","noir"].includes(LEATHER(shoes.color))){ s-=3; note="ceinture et chaussures pas du même cuir"; }
    }
    if((a.kind==="bonnet"||a.kind==="echarpe") && ctx.weather==="froid") s+=1;
    if(a.lastWorn && Date.now()-a.lastWorn<DAY) s-=1;
    s += Math.random()*0.6; // un peu de variété
    return {item:a, s, note};
  }).sort((x,y)=>y.s-x.s);
  const chosen=[]; const kinds=new Set();
  if(pinAcc){ chosen.push({item:pinAcc,s:9,note:null}); kinds.add(pinAcc.kind); }
  for(const c of cands){
    if(chosen.length>=3) break;
    if(kinds.has(c.item.kind) || c.s<=0.8) continue;
    if(kinds.has("casquette")&&c.item.kind==="bonnet" || kinds.has("bonnet")&&c.item.kind==="casquette") continue;
    chosen.push(c); kinds.add(c.item.kind);
  }
  return chosen;
}

/* ================= Stockage IndexedDB ================= */
let dbp;
function db(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    const r = indexedDB.open("penderie",2);
    r.onupgradeneeded = ()=>{ const d=r.result;
      for(const [n,k] of [["items","id"],["outfits","id"],["wears","id"],["meta","key"]]) if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:k}); };
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction(store,mode), s=t.objectStore(store);
    let out; const r = fn(s); if(r) r.onsuccess=()=>{out=r.result};
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}
const getAll = st => tx(st,"readonly",s=>s.getAll());
const getOne = (st,k) => tx(st,"readonly",s=>s.get(k));
const put = (st,v) => { if(st!=="meta" && !v?.sample) BK.bump(); return tx(st,"readwrite",s=>s.put(v)); };
const del = (st,id) => { BK.bump(); return tx(st,"readwrite",s=>s.delete(id)); };

function defaultWeather(){ const m=new Date().getMonth()+1; return [12,1,2,11].includes(m)?"froid":[6,7,8,9].includes(m)?"chaud":"doux"; }
try{ const s=JSON.parse(localStorage.getItem("penderie.ctx")); if(s&&SEA[s.weather]&&OCC[s.occ]) Object.assign(state.ctx,{weather:s.weather,occ:s.occ,wmode:s.wmode==="manual"?"manual":"auto"}); }catch(e){}
const saveCtx = ()=>{ try{ localStorage.setItem("penderie.ctx",JSON.stringify({weather:state.ctx.weather,occ:state.ctx.occ,wmode:state.ctx.wmode})); }catch(e){} };

const urls = new Map();
function photoURL(item){
  if(!item.photo) return null;
  if(!urls.has(item.id)) urls.set(item.id, URL.createObjectURL(item.photo));
  return urls.get(item.id);
}
function dropURL(id){ if(urls.has(id)){ URL.revokeObjectURL(urls.get(id)); urls.delete(id);} }

/* ================= Météo automatique (Open-Meteo, gratuit, sans clé) ================= */
function feelToWeather(f){ return f>=21?"chaud":f>=12?"doux":"froid"; }
async function refreshWeather(force){
  if(state.ctx.wmode!=="auto") return;
  try{
    const c=JSON.parse(localStorage.getItem("penderie.wx")||"null");
    if(c && !force && Date.now()-c.t<45*60e3){ applyWx(c); return; }
  }catch(e){}
  if(!navigator.geolocation){ state.wxStatus="unavailable"; render(); return; }
  state.wxStatus="loading"; render();
  try{
    const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:10000,maximumAge:3600e3,enableHighAccuracy:false}));
    const lat=pos.coords.latitude.toFixed(2), lon=pos.coords.longitude.toFixed(2);
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=apparent_temperature_max,apparent_temperature_min,precipitation_probability_max&current=temperature_2m&timezone=auto&forecast_days=1`);
    if(!r.ok) throw new Error("http");
    const d = await r.json();
    const wx = {t:Date.now(), max:d.daily.apparent_temperature_max[0], min:d.daily.apparent_temperature_min[0], rainP:d.daily.precipitation_probability_max?.[0]??0, now:d.current?.temperature_2m};
    try{ localStorage.setItem("penderie.wx",JSON.stringify(wx)); }catch(e){}
    applyWx(wx);
  }catch(e){
    state.wxStatus = (e && e.code===1) ? "denied" : "error"; render();
  }
}
function applyWx(wx){
  state.wx=wx; state.wxStatus="ok";
  const feel=(2*wx.max+wx.min)/3, w=feelToWeather(feel), rain=wx.rainP>=50;
  if(state.ctx.wmode==="auto" && (w!==state.ctx.weather || rain!==state.ctx.rain)){
    state.ctx.weather=w; state.ctx.rain=rain; state.current=null; state.avoid.clear(); saveCtx();
  }
  render();
}

function render(){
  const n=state.items.filter(i=>!i.sample).length, ex=state.items.length-n;
  document.getElementById("count").textContent = state.items.length
    ? [n?`${n} pièce${n>1?"s":""}`:"",ex?`${ex} exemple${ex>1?"s":""}`:""].filter(Boolean).join(" · ") : "Ton dressing, sur ton téléphone";
  document.querySelectorAll("nav .t[data-tab]").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===state.tab?"page":"false"));
  const v=document.getElementById("view");
  v.innerHTML = state.tab==="tenue" ? viewTenue() : state.tab==="suivi" ? viewSuivi() : viewDressing();
}

}

function weatherLine(){
  const c=state.ctx;
  if(c.wmode!=="auto") return `<div class="wx">Météo choisie à la main · <button class="link" data-act="wxauto">Revenir en auto</button></div>`;
  if(state.wxStatus==="loading") return `<div class="wx">${ICON.pin}Recherche de la météo du jour…</div>`;
  if(state.wxStatus==="denied") return `<div class="wx warn">Localisation refusée : choisis la météo à la main, ou autorise la localisation pour Safari dans les réglages de l'iPhone.</div>`;
  if(state.wxStatus==="error"||state.wxStatus==="unavailable") return `<div class="wx warn">Météo indisponible pour l'instant · <button class="link" data-act="wxretry">Réessayer</button></div>`;
  if(state.wx){ const w=state.wx; return `<div class="wx">${ICON.pin}<span>Aujourd'hui <b>${Math.round(w.min)}–${Math.round(w.max)} °C</b> ressentis${w.rainP>=50?` · ${ICON.rain}<b>pluie ${w.rainP} %</b>`:""}</span></div>`; }
  return `<div class="wx">${ICON.pin}Météo automatique</div>`;
}

function viewTenue(){
  const c=state.ctx;
  const wsel = c.wmode==="auto" ? "auto" : c.weather;
  const ctrl = `<div class="controls">
    <div><div class="ctl-label">Météo${c.wmode==="auto"&&state.wxStatus==="ok"?` · ${{chaud:"chaud",doux:"doux",froid:"froid"}[c.weather]}`:""}</div>${seg("weather",[["auto","Auto"],["chaud","Chaud"],["doux","Doux"],["froid","Froid"]],wsel)}${weatherLine()}</div>
    <div><div class="ctl-label">Occasion</div>${seg("occ",[["casual","Décontracté"],["chic","Habillé"],["sport","Sport"]],c.occ)}</div>
  </div>`;
  if(!state.items.length) return ctrl+emptyBlock("Prends ton dressing en photo","Ajoute tes hauts, bas, chaussures et vestes. L'app compose des tenues selon les couleurs, le style et la météo.");
  const pin = c.pin ? state.items.find(i=>i.id===c.pin) : null;
  if(c.pin && !pin) c.pin=null;
  const pinBar = pin ? `<div class="pinbar">${ph(pin)}<span>Tenue autour de <b>${esc(itemName(pin))}</b></span><button class="icon-btn" data-act="unpin" aria-label="Arrêter">${ICON.x}</button></div>` : "";
  if(!state.current) state.current = generate(state.items, c, state.avoid);
  const g=state.current;
  let card;
  if(g.missing){
    card = `<div class="empty"><h2>Il manque des pièces</h2><p>Pour cette météo et cette occasion, ajoute au moins ${g.missing.join(", ")}.</p><button class="btn primary" data-act="add">Ajouter une pièce</button></div>`;
  } else {
    const o=g.outfit, isFav = state.outfits.some(f=>f.k===o.k);
    const ordered = MAIN_ORDER.map(t=>o.pieces.find(p=>p.type===t)).filter(Boolean);
    const odd = ordered.length%2===1;
    const acc = o.acc||[];
    const accNotes = acc.map(a=>a.note).filter(Boolean);
    card = `<article class="outfit" aria-label="Tenue proposée">
      <div class="flatlay">${ordered.map((p,i)=>piecesTile(p, odd&&i===ordered.length-1)).join("")}</div>
      ${acc.length?`<div><div class="ctl-label">Accessoires</div><div class="accrow">${acc.map(a=>piecesTile(a.item)).join("")}</div></div>`:""}
      <div class="score-row"><div class="score">${o.colorScore}<small>/10</small></div><div style="flex:1"><div class="ctl-label" style="margin:0 0 5px">Harmonie des couleurs</div><div class="meter"><i style="width:${o.colorScore*10}%"></i></div></div></div>
      <ul class="why">${o.ok.map(t=>`<li>${esc(t)}</li>`).join("")}${accNotes.filter(n=>!n.startsWith("ceinture et")).map(t=>`<li>${esc(t)}</li>`).join("")}${o.warn.map(t=>`<li class="warn">${esc(t)}</li>`).join("")}${accNotes.filter(n=>n.startsWith("ceinture et")).map(t=>`<li class="warn">Attention : ${esc(t)}</li>`).join("")}${g.noJacket?`<li class="warn">Il fait froid et tu n'as pas encore de veste enregistrée</li>`:""}${c.rain&&c.weather!=="chaud"?`<li>Pluie prévue : la veste est incluse d'office</li>`:""}</ul>
      <div class="actions">
        <button class="btn primary" data-act="next">Autre tenue</button>
        <button class="btn ghost sq" data-act="dislike" aria-label="Pas fan, propose autre chose">${ICON.down}</button>
        <button class="btn ghost sq" data-act="fav" aria-label="${isFav?"Retirer des favoris":"J'aime, garder en favori"}" aria-pressed="${isFav}">${ICON.heart(isFav)}</button>
        <button class="btn ghost" data-act="wear">Je la porte</button>
      </div>
    </article>`;
  }
  const favs = state.outfits.map(f=>({f, pieces:f.ids.map(id=>state.items.find(i=>i.id===id)).filter(Boolean)})).filter(x=>x.pieces.length===x.f.ids.length);
  const favHtml = favs.length ? `<div class="section-h"><h2>Mes tenues favorites</h2><span class="sub">${favs.length}</span></div>
    <div class="favs">${favs.map(({f,pieces})=>`<div class="fav"><button class="thumbs" data-act="showfav" data-id="${f.id}" aria-label="Afficher cette tenue">${pieces.map(ph).join("")}</button>
      <button class="icon-btn" data-act="unfav" data-id="${f.id}" aria-label="Retirer des favoris">${ICON.x}</button></div>`).join("")}</div>` : "";
  const val=loadValise();
  const valHtml=`<button class="valcard" data-act="valise"><span class="vi">${ICON.bag}</span><span><b>${val?`Ma valise${val.place?` · ${esc(val.place)}`:""}`:"Mode valise"}</b><span class="sub">${val?`${val.nights} jours · touche pour voir la liste`:"Le minimum de pièces pour un voyage, selon la météo sur place"}</span></span></button>`;
  return backupBanner()+ctrl+pinBar+card+favHtml+valHtml;
}

function viewDressing(){
  if(!state.items.length) return `<div style="margin-top:14px">${emptyBlock("Ton dressing est vide","Commence par 4 ou 5 pièces que tu portes souvent. Tu peux prendre la photo directement depuis l'app.")}</div>`;
  const counts = Object.fromEntries(TYPES.map(t=>[t.id,state.items.filter(i=>i.type===t.id).length]));
  const nrev=state.items.filter(i=>i.review).length;
  if(state.filter==="review"&&!nrev) state.filter="tout";
  const chips = [...(nrev?[["review","À vérifier",nrev]]:[]),["tout","Tout",state.items.length],...TYPES.filter(t=>counts[t.id]||t.id!=="accessoire").map(t=>[t.id,t.plural,counts[t.id]])];
  const list = state.items.filter(i=>state.filter==="tout"||(state.filter==="review"?i.review:i.type===state.filter)).sort((a,b)=>b.created-a.created);
  return `${state.filter==="review"?`<p class="sub" style="margin:14px 0 0">Ouvre chaque pièce, corrige si besoin et enregistre : le badge disparaît.</p>`:""}<div class="filters" role="group" aria-label="Filtrer">${chips.map(([v,l,n])=>`<button class="chip" data-filter="${v}" aria-pressed="${state.filter===v}">${l}<span class="n">${n}</span></button>`).join("")}</div>

/* ================= Suivi : historique et stats ================= */
function viewSuivi(){
  if(!state.items.length) return `<div style="margin-top:14px">${emptyBlock("Rien à suivre pour l'instant","Ajoute tes pièces, puis appuie sur « Je la porte » quand tu choisis une tenue : l'historique et les stats se remplissent tout seuls.")}</div>`;
  const now=Date.now(), byId=Object.fromEntries(state.items.map(i=>[i.id,i]));
  const recent=state.wears.filter(w=>now-w.date<30*DAY);
  const count={}; for(const w of state.wears) for(const id of w.ids) count[id]=(count[id]||0)+1;
  const worn30=new Set(recent.flatMap(w=>w.ids));
  const pct=Math.round(100*state.items.filter(i=>worn30.has(i.id)).length/state.items.length);
  const tiles=`<div class="stats">
    <div class="stat"><b>${recent.length}</b><span>tenue${recent.length>1?"s":""} portée${recent.length>1?"s":""} en 30 jours</span></div>
    <div class="stat"><b>${pct}<small> %</small></b><span>du dressing porté en 30 jours</span></div>
    <div class="stat"><b>${state.outfits.length}</b><span>tenue${state.outfits.length>1?"s":""} favorite${state.outfits.length>1?"s":""}</span></div></div>`;
  const hist = state.wears.length ? `<div class="favs">${state.wears.slice(0,12).map(w=>{ const ps=w.ids.map(id=>byId[id]).filter(Boolean); return `<div class="fav"><div class="when">${dateFR(w.date)}</div><div class="thumbs">${ps.map(ph).join("")}</div><button class="icon-btn" data-act="delwear" data-id="${w.id}" aria-label="Retirer de l'historique">${ICON.x}</button></div>`; }).join("")}</div>`
    : `<p class="sub">Aucune tenue enregistrée. Appuie sur « Je la porte » dans l'onglet Tenue.</p>`;
  const most = Object.entries(count).filter(([id])=>byId[id]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxC = most[0]?.[1]||1;
  const mostHtml = most.length ? `<div class="rank">${most.map(([id,n])=>`<div class="rk">${ph(byId[id])}<div class="rk-b"><div class="rk-n"><span>${esc(itemName(byId[id]))}</span><b>${n}×</b></div><div class="meter"><i style="width:${n/maxC*100}%"></i></div></div></div>`).join("")}</div>` : `<p class="sub">Pas encore de données.</p>`;
  const sleepy = state.items.filter(i=>!worn30.has(i.id) && !(i.lastWorn && now-i.lastWorn<60*DAY) && now-i.created>3*DAY)
    .sort((a,b)=>(a.lastWorn||0)-(b.lastWorn||0)).slice(0,8);
  const sleepyHtml = sleepy.length ? `<div class="rank">${sleepy.map(i=>`<div class="rk">${ph(i)}<div class="rk-b"><div class="rk-n"><span>${esc(itemName(i))}</span></div><span class="sub">${i.lastWorn?`Dernière fois : ${dateFR(i.lastWorn)}`:"Jamais portée"}</span></div><button class="btn ghost sm" data-act="pin" data-id="${i.id}">Tenue avec</button></div>`).join("")}</div>`
    : `<p class="sub">Toutes tes pièces ont été portées récemment.</p>`;
  const colCount={}; for(const i of state.items) colCount[i.color]=(colCount[i.color]||0)+1;
  const cols=Object.entries(colCount).sort((a,b)=>b[1]-a[1]);
  const colorsHtml = `<div class="colorbar">${cols.map(([c,n])=>`<i class="${c==="motif"?"motif":""}" style="flex:${n};${C[c].hex?`background:${C[c].hex}`:""}" title="${C[c].label}"></i>`).join("")}</div>
    <div class="legend">${cols.slice(0,6).map(([c,n])=>`<span>${dot(c)}${C[c].label} <b>${Math.round(100*n/state.items.length)} %</b></span>`).join("")}</div>`;
  return `<div style="margin-top:14px">${tiles}</div>
    <div class="section-h"><h2>Dernières tenues</h2></div>${hist}
    <div class="section-h"><h2>Les plus portées</h2></div>${mostHtml}
    <div class="section-h"><h2>À ressortir</h2><span class="sub">pas portées depuis 2 mois</span></div>${sleepyHtml}
    <div class="section-h"><h2>Ce qui manque</h2></div>${gapsHtml()}
    <div class="section-h"><h2>Couleurs du dressing</h2></div>${colorsHtml}`;
}

/* ================= Feuille d'ajout / édition ================= */
let sheetState=null;
function openSheet(html){
  document.querySelector(".sheet-bg")?.remove(); // on garde sheetState : l'éditeur se re-rend dans la même feuille
  const bg=document.createElement("div"); bg.className="sheet-bg"; bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("click",e=>{ if(e.target===bg) closeSheet(); });
  document.body.appendChild(bg); document.body.style.overflow="hidden";
}
function closeSheet(){ document.querySelector(".sheet-bg")?.remove(); document.body.style.overflow=""; if(sheetState?.previewURL) URL.revokeObjectURL(sheetState.previewURL); sheetState=null; }

function openEditor(item){
  const isNew=!item;
  sheetState = item ? {...item, newPhoto:undefined} : {id:uid(), type:"haut", kind:"montre", color:"noir", style:"casual", season:"toutes", name:"", photo:null, created:Date.now()};
  if(!sheetState.kind) sheetState.kind="montre";
  renderEditor(isNew);
  if(isNew) loadModel().catch(()=>{});
}
function renderEditor(isNew){
  const s=sheetState;
  const preview = s.previewURL ? `<div class="ph ${s.newCut?"cut":""}"><img src="${s.previewURL}" alt=""></div>` : ph(s);
  const opt = (name, list, val)=>`<div class="opts" role="group">${list.map(o=>`<button class="chip" data-f="${name}" data-v="${o.id}" aria-pressed="${o.id===val}">${o.label}</button>`).join("")}</div>`;
  const canCut = !s.busy && ((s.previewURL && !s.newCut) || (!s.previewURL && s.photo && !s.cut));
  openSheet(`<div class="grab"></div>
    <div class="sheet-h"><h2>${isNew?"Nouvelle pièce":"Modifier la pièce"}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">${ICON.x}</button></div>
    <details class="tips" ${(isNew&&state.items.filter(i=>!i.sample).length<3)||s.showTips?"open":""}>
      <summary>Conseils pour une bonne photo</summary>
      <ul>
        <li><b>Une seule pièce</b> par photo, rien d'autre dans le cadre.</li>
        <li><b>Centre-la et remplis le cadre</b> : la reconnaissance regarde surtout le milieu de l'image.</li>
        <li><b>Fond uni et contrasté</b> : drap ou sol clair pour une pièce foncée, fond sombre pour une pièce claire. Le détourage n'en sera que plus net.</li>
        <li><b>Lumière du jour</b>, près d'une fenêtre, sans flash ni contre-jour : les couleurs restent justes.</li>
        <li><b>À plat, prise du dessus</b>, ou sur un cintre contre un mur. Défroisse et étale bien les manches.</li>
        <li><b>Chaussures</b> : une seule, de profil. <b>Accessoires</b> : posés seuls, bien au centre.</li>
      </ul>
    </details>
    ${isNew?`<label class="btn ghost" for="batchIn" style="text-align:center">Ajouter plusieurs photos d'un coup</label><input type="file" id="batchIn" accept="image/*" multiple hidden>`:""}
    <div class="photo-pick">${preview}<div style="display:grid;gap:6px">
      <label class="btn primary" for="photoIn">${(s.photo||s.previewURL)?"Changer la photo":"Prendre une photo"}</label>
      <input type="file" id="photoIn" accept="image/*" hidden>
      ${canCut?`<button class="btn ghost sm" data-act="cutnow">Détourer la photo</button>`:""}
      <span class="hint" id="colorHint" aria-live="polite">${s.hint||"Prends la pièce seule, à plat ou sur un cintre : type, style, saison et couleur sont reconnus automatiquement."}</span></div></div>
    <div class="field"><div class="ctl-label">Nom (facultatif)</div><input type="text" id="nameIn" placeholder="ex. Chemise Oxford" value="${esc(s.name)}" maxlength="40"></div>
    <div class="field"><div class="ctl-label">Type</div>${opt("type",TYPES,s.type)}</div>
    ${s.type==="accessoire"?`<div class="field"><div class="ctl-label">Genre d'accessoire</div>${opt("kind",KINDS,s.kind)}</div>`:""}
    <div class="field"><div class="ctl-label">Couleur principale</div>
      <div class="swatches" role="group">${COLORS.map(c=>`<button class="swb ${s.colorAlt===c.id&&c.id!==s.color&&!s.touched?.has("color")?"alt":""}" data-f="color" data-v="${c.id}" aria-pressed="${c.id===s.color}"><span class="sw ${c.id==="motif"?"motif":""}" style="${c.hex?`background:${c.hex}`:""}"></span>${c.label}</button>`).join("")}</div></div>
    ${s.color!=="motif"?`<div class="field"><div class="ctl-label">Couleur secondaire (facultatif)</div>
      <div class="swatches" role="group"><button class="swb" data-f="color2" data-v="" aria-pressed="${!s.color2}"><span class="sw none"></span>Aucune</button>${COLORS.filter(c=>c.id!=="motif"&&c.id!==s.color).map(c=>`<button class="swb" data-f="color2" data-v="${c.id}" aria-pressed="${c.id===s.color2}"><span class="sw" style="background:${c.hex}"></span>${c.label}</button>`).join("")}</div>
      <span class="hint">Pour les pièces bicolores : logo, semelle, empiècement… Elle compte moins que la principale, mais l'app saura l'accorder.</span></div>`:""}
    <div class="field"><div class="ctl-label">Style</div>${opt("style",STYLES,s.style)}</div>
    <div class="field"><div class="ctl-label">Saison</div>${opt("season",SEASONS,s.season)}</div>
    <button class="btn primary" data-act="save" ${s.busy?"disabled":""}>${s.busy?"Patiente, analyse en cours…":isNew?"Ajouter au dressing":"Enregistrer"}</button>
    ${isNew?"":`<button class="btn ghost" data-act="pin" data-id="${s.id}">Créer une tenue avec cette pièce</button>
    <div id="delZone"><button class="btn danger" data-act="askdel" style="width:100%">Supprimer cette pièce</button></div>`}`);
  sheetState.isNew=isNew;
  document.getElementById("photoIn").addEventListener("change",onPhoto);
  document.getElementById("batchIn")?.addEventListener("change",e=>startBatch(e.target.files));
  document.getElementById("nameIn").addEventListener("input",e=>{ sheetState.name=e.target.value; });
}

async function onPhoto(e){
  const f=e.target.files[0]; if(!f) return;
  let res;
  try{ res = await processImage(f); }catch(err){ toast("Impossible de lire cette photo. Essaie en JPEG ou PNG."); return; }
  const s=sheetState; if(!s) return;
  if(s.previewURL) URL.revokeObjectURL(s.previewURL);
  s.newPhoto=res.blob; s.newCut=false; s.previewURL=URL.createObjectURL(res.blob);
  s.touched=new Set(); s.wb=res.wb; s.detected=res.color; s.colorAlt=res.colorAlt; s.color=res.color; s.busy=true;
  s.hint = modelReady||seen("reco") ? "Analyse de la pièce…" : "Premier lancement : téléchargement de la reconnaissance (~16 Mo, une seule fois)…";
  renderEditor(s.isNew);
  let label=null;
  try{
    const g = await recognize(res.canvas);
    if(sheetState!==s) return; // feuille fermée ou autre pièce entre-temps
    if(!g) s.showTips=true;
    if(g){ for(const f of ["type","style","season","kind"]) if(g[f] && !s.touched.has(f)) s[f]=g[f]; label=g.label; }
  }catch(err){ if(sheetState!==s) return; label=false; }
  const col = ()=> `${C[s.color].label.toLowerCase()}${s.color2&&C[s.color2]?` et ${C[s.color2].label.toLowerCase()}`:""}${s.colorAlt&&s.colorAlt!==s.color&&!s.touched?.has("color")?` (ou peut-être ${C[s.colorAlt].label.toLowerCase()})`:""}`;
  const recoMsg = ()=> label ? `Reconnu : ${label}, couleur ${col()}. Corrige si besoin.`
    : label===false ? `Reconnaissance indisponible (connexion ?). Couleur détectée : ${col()}.`
    : `Type pas reconnu avec certitude, choisis-le (ou reprends la photo en suivant les conseils). Couleur détectée : ${col()}.`;
  if(settings.cutout){
    s.hint = recoMsg()+(seen("cut")?" Détourage en cours…":" Détourage en cours (premier détourage : ~40 Mo à télécharger, une seule fois)…"); renderEditor(s.isNew);
    await doCutout(s, res.blob);
    if(sheetState!==s) return;
  }
  s.busy=false; s.hint = recoMsg() + (s.cutFailed?" Le détourage n'a pas pu se faire, la photo d'origine est gardée.":"");
  renderEditor(s.isNew);
}

/* ================= Détourage (suppression du fond, dans le navigateur) ================= */
let bgLib=null;
const seen = k => { try{ return localStorage.getItem("penderie.dl."+k)==="1"; }catch(e){ return false; } };
const markSeen = k => { try{ localStorage.setItem("penderie.dl."+k,"1"); }catch(e){} };
function loadBgLib(){
  if(!bgLib) bgLib = import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm").catch(e=>{ bgLib=null; throw e; });
  return bgLib;
}
async function cutout(blob, wb){
  const lib = await loadBgLib();
  const out = await lib.removeBackground(blob, {model:"isnet_quint8", output:{format:"image/png"}});
  // recadre au plus près de la pièce, avec une petite marge, pour qu'elle remplisse la vignette
  const img = await createImageBitmap(out);
  const cv=document.createElement("canvas"); cv.width=img.width; cv.height=img.height;
  const g=cv.getContext("2d"); g.drawImage(img,0,0);
  const d=g.getImageData(0,0,cv.width,cv.height).data;
  let x0=cv.width,y0=cv.height,x1=0,y1=0;
  for(let y=0;y<cv.height;y+=2) for(let x=0;x<cv.width;x+=2){ if(d[(y*cv.width+x)*4+3]>40){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<=x0||y1<=y0) throw new Error("vide");
  const pad=Math.round(Math.max(x1-x0,y1-y0)*0.06);
  x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(cv.width,x1+pad); y1=Math.min(cv.height,y1+pad);
  const max=700, r=Math.min(1,max/Math.max(x1-x0,y1-y0));
  const c2=document.createElement("canvas"); c2.width=Math.round((x1-x0)*r); c2.height=Math.round((y1-y0)*r);
  c2.getContext("2d").drawImage(cv,x0,y0,x1-x0,y1-y0,0,0,c2.width,c2.height);
  const png = await new Promise(res=>c2.toBlob(res,"image/png"));
  const dc=detectColor(c2,true,wb); return {blob:png, color:dc.id, colorAlt:dc.alt, color2:dc.second};
}
async function doCutout(s, blob){
  try{
    const r = await cutout(blob, s.wb);
    if(sheetState!==s) return;
    if(s.previewURL) URL.revokeObjectURL(s.previewURL);
    markSeen("cut"); s.newPhoto=r.blob; s.newCut=true; s.previewURL=URL.createObjectURL(r.blob); s.cutFailed=false;
    if(!s.touched?.has("color")){ s.color=r.color; s.detected=r.color; s.colorAlt=r.colorAlt; }
    if(!s.touched?.has("color2") && r.color2!==s.color) s.color2=r.color2||null;
  }catch(e){ s.cutFailed=true; }
}

/* ================= Reconnaissance automatique =================
   MobileNet (ImageNet, 1000 classes) tourne dans le navigateur : gratuit, rien n'est envoyé sur un serveur.
   On ne garde que les classes de vêtements et d'accessoires, chacune associée à un type, un style et une saison. */
const CLOTHES = {
  610:["haut","casual","toutes","T-shirt"], 841:["pull","casual","mi","sweat"], 474:["pull","poly","mi","gilet / cardigan"],
  911:["pull","casual","hiver","pull en laine"], 617:["haut","poly","toutes","chemise"], 457:["haut","chic","toutes","chemise habillée"],
  906:["haut","chic","toutes","chemise et cravate"], 697:["haut","casual","toutes","haut"],
  834:["veste","chic","mi","veste de costume"], 869:["veste","chic","mi","trench"], 568:["veste","chic","hiver","manteau"],
  501:["veste","casual","hiver","manteau"], 735:["veste","casual","mi","poncho"], 399:["veste","chic","hiver","manteau long"],
  465:["veste","casual","hiver","doudoune sans manches"], 652:["veste","casual","mi","veste militaire"],
  608:["bas","casual","toutes","jean"], 655:["bas","casual","ete","jupe"], 689:["bas","casual","ete","jupe"], 842:["bas","sport","ete","short de bain"],
  770:["chaussures","sport","toutes","baskets de running"], 630:["chaussures","chic","toutes","mocassins"],
  514:["chaussures","casual","hiver","bottes"], 774:["chaussures","casual","ete","sandales"], 502:["chaussures","casual","ete","sabots"],
  836:["accessoire","poly","ete","lunettes de soleil","lunettes"], 837:["accessoire","poly","ete","lunettes de soleil","lunettes"],
  531:["accessoire","poly","toutes","montre","montre"], 464:["accessoire","poly","toutes","ceinture","ceinture"],
  824:["accessoire","poly","hiver","écharpe","echarpe"], 796:["accessoire","casual","hiver","bonnet","bonnet"],
  414:["accessoire","casual","toutes","sac à dos","sac"], 748:["accessoire","chic","toutes","sac","sac"], 636:["accessoire","casual","toutes","sacoche","sac"],
  515:["accessoire","casual","ete","chapeau","casquette"], 679:["accessoire","poly","toutes","bijou","bijou"],
};
let modelReady=false, modelP=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function loadModel(){
  if(!modelP) modelP=(async()=>{
    if(!window.tf) await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js");
    const m = await tf.loadLayersModel("https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_1.0_224/model.json");
    modelReady=true; markSeen("reco"); return m;
  })().catch(e=>{ modelP=null; throw e; });
  return modelP;
}
function guessFromProbs(probs){
  const entries=Object.entries(CLOTHES).map(([i,v])=>({p:probs[i],type:v[0],style:v[1],season:v[2],label:v[3],kind:v[4]}));
  if(entries.reduce((a,e)=>a+e.p,0)<0.12) return null; // la photo ne ressemble à aucun vêtement connu du modèle
  const top=(list,f)=>{ const t={}; for(const e of list) t[e[f]]=(t[e[f]]||0)+e.p; return Object.entries(t).sort((x,y)=>y[1]-x[1])[0][0]; };
  const type=top(entries,"type");
  const same=entries.filter(e=>e.type===type); // style et saison : seulement parmi les classes du type retenu
  const best=same.reduce((x,y)=>y.p>x.p?y:x);
  return {type, style:top(same,"style"), season:top(same,"season"), label:best.label, kind:type==="accessoire"?best.kind:undefined};
}
async function recognize(canvas){
  const model = await loadModel();
  const probs = tf.tidy(()=>{
    const side=Math.min(canvas.width,canvas.height);
    const sq=document.createElement("canvas"); sq.width=sq.height=224;
    sq.getContext("2d").drawImage(canvas,(canvas.width-side)/2,(canvas.height-side)/2,side,side,0,0,224,224);
    const x=tf.browser.fromPixels(sq).toFloat().div(127.5).sub(1).expandDims(0);
    return model.predict(x).dataSync();
  });
  return guessFromProbs(probs);
}
async function processImage(file){
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const max=900, r=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement("canvas"); cv.width=Math.round(img.width*r); cv.height=Math.round(img.height*r);
  const g=cv.getContext("2d"); g.drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(img.src);
  const blob = await new Promise(res=>cv.toBlob(res,"image/jpeg",.82));
  const wb=estimateWB(cv), dc=detectColor(cv,false,wb); return {blob, color: dc.id, colorAlt: dc.alt, canvas: cv, wb};
}
/* Couleur dominante, version perceptuelle :
   1. on travaille dans l'espace Lab (distances proches de la perception humaine), pas en RGB ;
   2. on regroupe les pixels en 5 familles (k-means) au lieu de voter pixel par pixel ;
   3. on fusionne les familles de même teinte mais de luminosité différente (zones éclairées / plis à l'ombre) ;
   4. on compare la famille dominante à plusieurs nuances de référence par couleur, en pénalisant peu la luminosité
      (une ombre assombrit sans changer la couleur).
   Photo brute : centre de l'image. Photo détourée : tous les pixels opaques. */
const SHADES = {
  noir:["#141416","#232326","#2e2f33"], blanc:["#f6f6f3","#e9e9e4","#fbfaf5"], gris:["#8b8f96","#5c6066","#b9bdc3","#43464b"],
  beige:["#d8c6a5","#e3d5bb","#c4ae8a"], marine:["#1f2b47","#18213a","#2b3b5f","#232f4a"], denim:["#4b6a8f","#33496a","#7d97b6","#5a7aa0"],
  kaki:["#6c6c3e","#545a33","#8a8a5c","#5f6a45"], marron:["#6b4631","#4a2f22","#86593d","#3d2a20"], camel:["#b98a52","#c99c65","#a87843"],
  bordeaux:["#6e1f2d","#521823","#7d2a38"], rouge:["#c63a2f","#a8241c","#d9483a"], rose:["#e8a3b3","#f2c6d0","#d47a92","#f0b7a8"],
  orange:["#e07c2c","#ef9a4a","#c9651f"], jaune:["#e9c449","#f2dc86","#d4a82a"], vert:["#3e7d4f","#2a5a3a","#78a86a","#1f4a35"],
  bleu:["#3b7fd4","#6aa5e0","#2559a8","#9cc3ea"], violet:["#7b4fa1","#b79ad6","#5a3878"],
};
function hexToRgb(x){ return [1,3,5].map(k=>parseInt(x.slice(k,k+2),16)); }
function rgbToLab(r,g,b){
  const f=v=>{ v/=255; return v<=0.04045? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  const R=f(r),G=f(g),B=f(b);
  let X=(R*0.4124+G*0.3576+B*0.1805)/0.95047, Y=(R*0.2126+G*0.7152+B*0.0722), Z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const t=v=>v>0.008856? Math.cbrt(v) : 7.787*v+16/116;
  X=t(X); Y=t(Y); Z=t(Z);
  return [116*Y-16, 500*(X-Y), 200*(Y-Z)];
}
const PAL_LAB = Object.entries(SHADES).flatMap(([id,arr])=>arr.map(hx=>({id,lab:rgbToLab(...hexToRgb(hx))})));
function labDist(p,q,wL){ const dL=(p[0]-q[0])*wL, da=p[1]-q[1], db=p[2]-q[2]; return Math.sqrt(dL*dL+da*da+db*db); }
function nearestColors(lab){
  // la luminosité compte moins quand la pièce est colorée (ombres), davantage pour les neutres (noir/gris/blanc)
  const chroma=Math.hypot(lab[1],lab[2]), wL = chroma>18 ? 0.45 : 0.8;
  const best={};
  for(const p of PAL_LAB){ const d=labDist(lab,p.lab,wL); if(best[p.id]===undefined||d<best[p.id]) best[p.id]=d; }
  return Object.entries(best).sort((a,b)=>a[1]-b[1]);
}
/* Balance des blancs : si le fond de la photo brute est clair et neutre (drap, mur, sol clair),
   sa teinte révèle celle de la lumière (ampoule chaude, ombre bleutée). On corrige les canaux pour la neutraliser. */
function estimateWB(cv){
  const s=48, c=document.createElement("canvas"); c.width=c.height=s;
  const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(cv,0,0,s,s);
  const d=g.getImageData(0,0,s,s).data; let R=0,G=0,B=0,n=0;
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    if(x>4&&x<s-5&&y>4&&y<s-5) continue; // seulement la bordure
    const i=(y*s+x)*4; R+=d[i]; G+=d[i+1]; B+=d[i+2]; n++;
  }
  R/=n; G/=n; B/=n;
  const lab=rgbToLab(R,G,B);
  if(lab[0]<55 || Math.hypot(lab[1],lab[2])>22) return null; // fond foncé ou coloré : on ne peut rien en déduire
  const m=(R+G+B)/3, cl=v=>Math.max(0.82,Math.min(1.18,v));
  return [cl(m/R), cl(m/G), cl(m/B)];
}
function detectColor(cv, whole, wb){
  const s=64, c=document.createElement("canvas"); c.width=c.height=s;
  const w=cv.width, h=cv.height, cw=whole?w:w*.5, ch=whole?h:h*.5;
  const g=c.getContext("2d",{willReadFrequently:true}); g.imageSmoothingQuality="high";
  g.drawImage(cv,(w-cw)/2,(h-ch)/2,cw,ch,0,0,s,s);
  const d=g.getImageData(0,0,s,s).data;
  const px=[];
  const k0=wb||[1,1,1];
  for(let i=0;i<d.length;i+=4){ if(d[i+3]<160) continue; px.push(rgbToLab(Math.min(255,d[i]*k0[0]),Math.min(255,d[i+1]*k0[1]),Math.min(255,d[i+2]*k0[2]))); }
  if(px.length<20) return {id:"noir", alt:null, hex:null};
  // k-means, initialisation déterministe sur des quantiles de luminosité
  const k=Math.min(5,px.length);
  const sorted=[...px].sort((a,b)=>a[0]-b[0]);
  let cent=Array.from({length:k},(_,i)=>sorted[Math.floor((i+0.5)*sorted.length/k)].slice());
  const asg=new Int32Array(px.length);
  for(let it=0;it<12;it++){
    for(let i=0;i<px.length;i++){ let bi=0,bd=1e9; for(let j=0;j<k;j++){ const q=cent[j]; const dd=(px[i][0]-q[0])**2+(px[i][1]-q[1])**2+(px[i][2]-q[2])**2; if(dd<bd){bd=dd;bi=j;} } asg[i]=bi; }
    const sum=Array.from({length:k},()=>[0,0,0,0]);
    for(let i=0;i<px.length;i++){ const S=sum[asg[i]]; S[0]+=px[i][0]; S[1]+=px[i][1]; S[2]+=px[i][2]; S[3]++; }
    cent=sum.map((S,j)=>S[3]?[S[0]/S[3],S[1]/S[3],S[2]/S[3]]:cent[j]);
  }
  const cnt=new Array(k).fill(0); for(let i=0;i<px.length;i++) cnt[asg[i]]++;
  let groups=cent.map((c,j)=>({lab:c, w:cnt[j]})).filter(g=>g.w>0);
  // fusion des familles « même tissu, éclairage différent » : teinte proche, luminosité différente
  let merged=true;
  while(merged){
    merged=false;
    outer: for(let i=0;i<groups.length;i++) for(let j=i+1;j<groups.length;j++){
      const A=groups[i], B=groups[j];
      const ca=Math.hypot(A.lab[1],A.lab[2]), cb=Math.hypot(B.lab[1],B.lab[2]);
      const dab=Math.hypot(A.lab[1]-B.lab[1],A.lab[2]-B.lab[2]), dL=Math.abs(A.lab[0]-B.lab[0]);
      const bothNeutral = ca<10 && cb<10;
      if((!bothNeutral && dab<14 && dL<40) || (bothNeutral && dL<16)){
        const W=A.w+B.w;
        // on garde surtout la partie la mieux éclairée : c'est elle qui montre la vraie couleur
        const lit = A.lab[0]>B.lab[0]?A:B;
        const lab=[0,1,2].map(t=>(A.lab[t]*A.w+B.lab[t]*B.w)/W);
        lab[0]=lab[0]*0.6+lit.lab[0]*0.4;
        groups.splice(j,1); groups[i]={lab,w:W}; merged=true; break outer;
      }
    }
  }
  groups.sort((a,b)=>b.w-a.w);
  const total=groups.reduce((a,g)=>a+g.w,0);
  // motif : plusieurs familles bien colorées et bien différentes, chacune importante
  const strong=groups.filter(g=>g.w/total>0.18);
  if(strong.length>=3){
    let distinct=true;
    for(let i=0;i<strong.length;i++) for(let j=i+1;j<strong.length;j++) if(labDist(strong[i].lab,strong[j].lab,1)<28) distinct=false;
    if(distinct && strong.filter(g=>Math.hypot(g.lab[1],g.lab[2])>20).length>=2) return {id:"motif", alt:nearestColors(groups[0].lab)[0][0], hex:null};
  }
  const near=nearestColors(groups[0].lab);
  let second=null;
  if(whole){
    // une couleur franche (même en petite surface) parle plus qu'un neutre : la semelle blanche d'une basket
    // ou une doublure grise ne doivent pas masquer l'empiècement bleu
    const cands=groups.slice(1).filter(g=>g.w/total>=0.07).map(g=>({g,id:nearestColors(g.lab)[0][0],chroma:Math.hypot(g.lab[1],g.lab[2])}))
      .filter(x=>x.id!==near[0][0] && labDist(x.g.lab,groups[0].lab,1)>22);
    const colored=cands.find(x=>x.chroma>18 && C[x.id].fam!=="neutre");
    const neutral=cands.find(x=>x.g.w/total>=0.2);
    second=(colored||neutral)?.id||null;
  }
  const alt = near[1] && near[1][1] < near[0][1]*1.35 ? near[1][0] : null;
  return {id:near[0][0], alt, second, lab:groups[0].lab};
}

/* ================= Sauvegarde sans réglage =================
   Pas de compte ni de serveur : l'app prépare un fichier de sauvegarde et l'envoie dans la feuille de partage
   d'iOS (« Enregistrer dans Fichiers » → iCloud Drive). Un rappel discret apparaît seulement quand
   il y a des changements non sauvegardés. Le fichier garde toujours le même nom : iOS propose de remplacer l'ancien. */
const BK = {
  get(){ try{ return JSON.parse(localStorage.getItem("penderie.backup"))||{changes:0,last:0,snooze:0}; }catch(e){ return {changes:0,last:0,snooze:0}; } },
  set(v){ try{ localStorage.setItem("penderie.backup",JSON.stringify(v)); }catch(e){} },
  bump(){ const b=BK.get(); b.changes++; BK.set(b); backupFile=null; },
};
let backupFile=null, backupBusy=null;
function needsBackup(){
  const b=BK.get(), real=state.items.filter(i=>!i.sample).length;
  if(real<3 || b.changes===0 || Date.now()<b.snooze) return false;
  return b.changes>=5 || Date.now()-b.last>7*DAY;
}
async function prepareBackup(){
  if(backupFile) return backupFile;
  if(backupBusy) return backupBusy;
  backupBusy=(async()=>{
    const items = await Promise.all(state.items.map(async i=>({...i, photo: i.photo? await blobToData(i.photo):null})));
    const data = JSON.stringify({app:"penderie",version:3,exported:new Date().toISOString(),items,outfits:state.outfits,wears:state.wears,prefs});
    backupFile = new File([data],"Penderie-sauvegarde.json",{type:"application/json"});
    backupBusy=null; return backupFile;
  })();
  return backupBusy;
}
function backupDone(){ BK.set({changes:0,last:Date.now(),snooze:0}); }
async function shareBackup(){
  // le fichier est préparé à l'avance : iOS exige que le partage parte directement du tap
  const f = backupFile || await prepareBackup();
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:"Sauvegarde Penderie"}); backupDone(); toast("Sauvegarde enregistrée"); render(); }
    catch(e){ if(e.name!=="AbortError") toast("Le partage a échoué. Réessaie."); }
  } else {
    const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); backupDone(); toast("Sauvegarde téléchargée"); render();
  }
}

  if(!needsBackup()) return "";

  return `<div class="bk"><div><b>${n} changement${n>1?"s":""} pas encore sauvegardé${n>1?"s":""}</b><span class="sub">Un tap, puis « Enregistrer dans Fichiers » → iCloud Drive.</span></div>

}

  let lock=null; try{ lock=await navigator.wakeLock?.request("screen"); }catch(e){}

    batch.current=f.name; renderBatch();
    try{

      const it={id:uid(), type:"haut", kind:"montre", color:res.color, color2:null, style:"casual", season:"toutes", name:"", created:Date.now(), lastWorn:null, sample:false, cut:false, review:true, photo:res.blob};

      try{ const g=await recognize(res.canvas); if(g){ for(const k of ["type","style","season","kind"]) if(g[k]) it[k]=g[k]; label=g.label; } }catch(e){}
